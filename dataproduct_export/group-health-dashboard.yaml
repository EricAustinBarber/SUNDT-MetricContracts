      - name: custom_field_4
        displayName: Custom Field 4
        description: "<div><div><p id=\"isPasted\"><span style=\"margin: 0px; color:\
          \ rgb(0, 0, 0);\">Refers to user-configurable fields that extend the default\
          \ schema of the InEight Change module. These fields allow the organization\
          \ to add additional attributes or metadata beyond the built-in fields. InEight\
          \ supports custom drop-down lists (custom lists) and custom fields that\
          \ are specific to Issues, CORs, or CCOs. \_These fields are <strong style=\"\
          margin: 0px; font-weight: 700;\">free text fields</strong>.</span></p><p><span\
          \ style=\"margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\"><br style=\"\
          margin: 0px;\"></span></p><p><span style=\"margin: 0px; font-size: 13px;\
          \ color: rgb(0, 0, 0);\">Purpose / Use Case<br style=\"margin: 0px;\"></span></p><ul><li\
          \ style=\"margin: 0px;\"><span style=\"margin: 0px; font-size: 13px; color:\
          \ rgb(0, 0, 0);\">To capture additional, project-specific data that is not\
