product:
  productId: group-health-dashboard
  version: 1.0.0
  contactEmail: eabarber@sundt.com
  contactName: Eric A. Barber
  en:
    name: Group Health Dashboard
    description: 'The Group Health Dashboard data product provides an executive-level
      view of project performance across four core health dimensions: Financial, Schedule,
      Safety, and Quality. It consolidates gold-layer production views from Databricks
      covering project billing, accounts receivable, accounts payable, cash position,
      MPR financials, schedule task progress and float, safety incidents, PSLI and
      STCKY walk scores, CVIS compliance, and deficiency/punchlist tracking. This
      product directly backs the group-Group Health Power BI dashboard and enables
      cross-project health comparisons, score trending, and KPI drill-downs for project
      controls, finance, and executive leadership.'
    shortDescription: "Executive rollup of project health across Financial, Schedule,\
      \ Safety, and Quality dimensions \u2014 sourced from the Group Health Power\
      \ BI dashboard."
    businessContext: "Group Health is the primary executive performance management\
      \ framework used by project controls and senior leadership to assess project\
      \ health across the portfolio. Each project receives a composite health grade\
      \ derived from four scored dimensions: (1) Financial \u2014 billing aging, cash\
      \ position, accounts receivable, contract burn, and MPR cost-vs-budget; (2)\
      \ Schedule \u2014 SPI (Schedule Performance Index), float trend, baseline vs.\
      \ planned EAC, and percent complete; (3) Safety \u2014 TRIR, DART rate, STCKY\
      \ walk frequency and success rate, CVIS implementation score, and PSLI compliance;\
      \ (4) Quality \u2014 deficiency counts by category, CSI code, division group,\
      \ and cause/disposition. Data is sourced from InEight (schedule and field operations),\
      \ JD Edwards E1 (financials), Cosential (CRM/project setup), and STCKY/CVIS\
      \ safety platforms, unified through a Databricks Lakehouse gold-layer model."
    exampleQuestions:
    - Which projects currently have the lowest Group Health score?
    - What is the SPI trend over the last 3 months for active projects?
    - Which projects have accounts receivable aged more than 90 days?
    - What is the TRIR for each project in the current quarter?
    - How does each project's cash position compare to the contract value?
    - Which projects have the most open deficiencies attributed to Sundt?
    - What is the STCKY walk success rate by project for the past 30 days?
    - Show the baseline vs. planned EAC variance for all active projects.
    - Which projects are behind schedule based on SPI below 0.9?
    - What is the earned profit percentage YTD across the portfolio?
