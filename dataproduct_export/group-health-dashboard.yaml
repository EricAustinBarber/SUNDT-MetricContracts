      - name: date_client_notified
        displayName: Date Client Notified
        description: "<p>\u201CDate Client Notified\u201D identifies the date on which\
          \ the client or owner was formally notified of a change, issue, Potential\
          \ Change Order (PCO), or Client Change Order (CCO). Within InEight, this\
