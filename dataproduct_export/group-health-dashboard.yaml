        = prod.project_management_v.fact_control_budget_v.dim_cost_item_key</p><p>-
        What are the project details for a specific cost item based on the project
        ID? Join on prod.project_management_v.dim_cost_item_v.project_id = prod.conformed_v.dim_project_v.dim_project_key</p><p>-
        What are the assigned roles and employees for a specific project associated
        with a cost item? Join on prod.project_management_v.dim_cost_item_v.sec_project
        = prod.prolog_v.fact_projects_with_assigned_roles_v.project_number</p></div>
