      - name: requested_extension_days
        displayName: Requested Extension Days
        description: "<p><span id=\"isPasted\" style=\"\">Number of days Sundt has\
          \ requested to extend or reduce the contract completion date at the\_<a\
          \ class=\"fr-deletable\" data-oid=\"52\" data-otype=\"glossary_term\" href=\"\
          /app/document/52\"></a>\_</span><span style=\"\">\_stage.</span></p>"
        type: int
      - name: fact_cco_log_key
