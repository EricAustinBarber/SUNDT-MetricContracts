    fact_issues_log_v:
      name: fact_issues_log_v
      displayName: fact_issues_log_v
      description: <div><p>The `fact_issues_log_v` is a view table that contains information
        related to issues and changes in project management. It tracks details such
        as issue creation and modification dates, pricing and proposal statuses, aging
        days, assigned users, revenue categories, and various custom fields.</p><p>Some
        questions that could be answered by joining this table with others:</p><p>-
        What are the details of issues associated with a specific project? Join on
        prod.conformed_v.dim_project_v.dim_project_key = prod.project_management_v.fact_issues_log_v.dim_project_key</p><p>-
        What are the details of a particular issue across different projects? Join
        on prod.project_management_v.dim_issue_v.dim_issue_key = prod.project_management_v.fact_issues_log_v.dim_issue_key</p></div>
      schema:
      - name: dim_issue_key
        displayName: Dim Issue Key
        description: <p>Unique identifier for the change issue record in InEight,
          used as the primary key to relate to pricing/proposal details and issue
          documents.</p>
        type: bigint
      - name: current_value
        displayName: Current Value
        description: "<p id=\"isPasted\">The issue\u2019s Current Value updates automatically\
          \ with the information entered in the Pricing fields. The value that the\
          \ Current Value displays comes from the sum of the Self perform and Vendor\
          \ subtotals, plus any lump sum adjustments, if any.</p>"
        type: decimal(28,15)
      - name: etl_gold_timestamp
        displayName: Etl Gold Timestamp
        description: <p>The date and time when this business event occurred.</p>
        type: timestamp
      - name: sec_project
        displayName: Sec Project
        description: <div><p>User-facing project display number used to identify the
          related or associated project in the UI, reports, and integrations.</p></div>
        type: string
      - name: dim_project_key
        displayName: Dim Project Key
        description: <p>System-generated key used to uniquely identify this record
          for reporting.</p>
        type: bigint
      - name: change_issue_id
        displayName: Change Issue Id
        description: <p>Unique identifier for the change issue record in InEight,
          used as the primary key to relate to pricing/proposal details and issue
          documents.</p>
        type: bigint
      - name: dim_cco_key
        displayName: Dim Contract Completion Override Key
        description: <p>System-generated key used to uniquely identify this record
          for reporting.</p>
        type: bigint
      - name: phase_code
        displayName: Phase Code
        description: "<div><p id=\"isPasted\" style=\"\"><span style=\"margin: 0px;\
          \ color: rgb(0, 0, 0);\">AKA \"<strong style=\"margin: 0px; font-weight:\
          \ 700;\">Assigned WBS</strong>\" on Issue \"Details\" Tab.</span></p><p\
          \ style=\"\"><span style=\"margin: 0px; color: rgb(0, 0, 0);\">The phase\
          \ codes listed on this column of data do not necessarily correlate with\
          \ the phase codes that are assigned on the \"Pricing\" tab of the Issue.\
          \ \_The user has to \"Push to cost item pricing\" for the codes to become\
          \ available in the \"Pricing\" tab.</span></p><p style=\"\"><span style=\"\
          margin: 0px; color: rgb(0, 0, 0);\"><br style=\"margin: 0px;\"></span></p><p\
          \ style=\"\"><span style=\"margin: 0px; color: rgb(0, 0, 0);\">Definition</span></p><p\
          \ style=\"\"><span style=\"margin: 0px; color: rgb(0, 0, 0);\">\u201CAssigned\
          \ WBS\u201D represents the validated Work Breakdown Structure (WBS) element\
          \ associated with an issue. It links the issue to a specific WBS code that\
          \ defines the relevant scope of work, activity, or cost item within the\
          \ project structure. WBS codes include all terminal cost items from InEight\
          \ Control and can be assigned directly from InEight Plan, InEight Control,\
          \ or from the Assigned WBS section within the issue itself.</span></p><p\
          \ style=\"\"><span style=\"margin: 0px; font-size: 13px; color: rgb(0, 0,\
          \ 0);\"><br style=\"margin: 0px;\"></span></p><p style=\"\"><span style=\"\
          margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\">Purpose / Use Case<br\
          \ style=\"margin: 0px;\"></span></p><ul style=\"\"><li style=\"margin: 0px;\"\
          ><span style=\"margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\">To associate\
          \ each issue with a defined portion of the project\u2019s WBS, ensuring\
          \ alignment with the approved cost and schedule structure.<br style=\"margin:\
          \ 0px;\"></span></li><li style=\"margin: 0px;\"><span style=\"margin: 0px;\
          \ font-size: 13px; color: rgb(0, 0, 0);\">To enable consistent reporting\
          \ and traceability of issues, changes, and costs within project controls\
          \ and forecasting tools.<br style=\"margin: 0px;\"></span></li><li style=\"\
          margin: 0px;\"><span style=\"margin: 0px; font-size: 13px; color: rgb(0,\
          \ 0, 0);\">To support integrated analysis between Change Management, Scheduling,\
          \ Estimating, and Cost Control systems.<br style=\"margin: 0px;\"></span></li><li\
          \ style=\"margin: 0px;\"><span style=\"margin: 0px; font-size: 13px; color:\
          \ rgb(0, 0, 0);\">To maintain data integrity between InEight modules (Estimate\
          \ \u2192 Plan \u2192 Control \u2192 Change) for accurate project performance\
          \ tracking.<br style=\"margin: 0px;\"></span></li><li style=\"margin: 0px;\"\
          ><span style=\"margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\">To allow\
          \ automated grouping and roll-up of issues and changes by WBS element for\
          \ performance reporting and variance analysis.</span></li></ul></div>"
        type: string
      - name: change_condition
        displayName: Change Condition (Category)
        description: "<div><p id=\"isPasted\" style=\"\"><span style=\"margin: 0px;\
          \ color: rgb(0, 0, 0);\">\u201CChange Condition\u201D, which has been renamed\
          \ to \"<strong style=\"margin: 0px; font-weight: 700;\">Category</strong>\"\
          \ by Sundt, is a drop-down menu populated with general conditions of change\
          \ that classify the type or nature of an identified issue, change event,\
          \ or adjustment. It provides a standardized method for categorizing why\
          \ a change occurred and how it should be processed within project controls,\
          \ contract management, and cost tracking workflows.</span></p><p style=\"\
          \"><span style=\"margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\"><br\
          \ style=\"margin: 0px;\"></span></p><p style=\"\"><span style=\"margin:\
          \ 0px; font-size: 13px; color: rgb(0, 0, 0);\">Purpose / Use Case</span></p><ul\
          \ style=\"\"><li style=\"margin: 0px;\"><span style=\"margin: 0px; font-size:\
          \ 13px; color: rgb(0, 0, 0);\">To standardize classification of changes\
          \ for consistent reporting and analysis across projects.</span></li><li\
          \ style=\"margin: 0px;\"><span style=\"margin: 0px; font-size: 13px; color:\
          \ rgb(0, 0, 0);\">To support accurate routing of changes through contract,\
          \ cost, and approval workflows.</span></li><li style=\"margin: 0px;\"><span\
          \ style=\"margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\">To enable\
          \ analytics of change trends, root causes, and financial impacts within\
          \ InEight and downstream systems.</span></li><li style=\"margin: 0px;\"\
          ><span style=\"margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\">To facilitate\
          \ visibility of change drivers for forecasting, audit, and lessons-learned\
          \ reviews.</span></li></ul></div>"
        type: string
      - name: dim_cor_key
        displayName: Dim Cor Key
        description: <p>System-assigned identifier used to uniquely represent this
          record.</p>
        type: bigint
      - name: pricing_status
        displayName: Pricing Status
        description: <p>Indicates the current stage of pricing for the issue, showing
          progress on scope elements such as labor, equipment, time, and vendor costs.</p>
        type: string
      - name: proposal_status
        displayName: Proposal Status
        description: "<p>Represents the issue\u2019s position within the proposal\
          \ lifecycle, identifying its progress through scoping, pricing integration,\
          \ internal review, and submission for client consideration.</p>"
        type: string
      - name: cost
        displayName: Cost
        description: <p id="isPasted"><strong>Cost</strong> identifies the estimated
          or priced cost associated with an InEight Change issue. It represents the
          cost items, vendor costs, direct costs, and indirect costs used to price
          the issue and determine the amount that may be proposed to the client if
          the issue becomes a change order. InEight Change supports pricing issues
          from existing estimate cost items or by adding new cost items, with the
          pricing summary organizing totals by direct cost, vendor cost, and indirect
          cost.</p>
        type: decimal(28,15)
      - name: field_contact
        displayName: Field Contact
        description: "<div><p id=\"isPasted\" style=\"\"><span style=\"margin: 0px;\
          \ color: rgb(0, 0, 0);\">Identifies the primary individual responsible for\
          \ or knowledgeable about the work, condition, or issue being documented\
          \ in the field. It designates the on-site point of contact who can provide\
          \ clarification, context, or verification for field activities, observations,\
          \ or issues associated with a Daily Plan or Change record.</span></p><p\
          \ style=\"\"><span style=\"margin: 0px; font-size: 13px; color: rgb(0, 0,\
          \ 0);\"><br style=\"margin: 0px;\"></span></p><p style=\"\"><span style=\"\
          margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\">Purpose / Use Case</span></p><ul\
          \ style=\"\"><li style=\"margin: 0px; color: rgb(0, 0, 0);\"><span style=\"\
          margin: 0px; font-size: 13px;\">To establish a direct point of communication\
          \ between field operations and project management teams.</span></li><li\
          \ style=\"margin: 0px; color: rgb(0, 0, 0);\"><span style=\"margin: 0px;\
          \ font-size: 13px;\">To identify the individual who observed or reported\
          \ a field condition that may result in an Issue or Change.</span></li><li\
          \ style=\"margin: 0px; color: rgb(0, 0, 0);\"><span style=\"margin: 0px;\
          \ font-size: 13px;\">To support coordination, validation, and follow-up\
          \ on field-related inquiries during change reviews, claim evaluations, or\
          \ audits.</span></li><li style=\"margin: 0px; color: rgb(0, 0, 0);\"><span\
          \ style=\"margin: 0px; font-size: 13px;\">To enable more efficient communication\
          \ across project roles \u2014 ensuring field information is verified by\
          \ the responsible party.</span></li><li style=\"margin: 0px; color: rgb(0,\
          \ 0, 0);\"><span style=\"margin: 0px; font-size: 13px;\">To enhance traceability\
          \ between the Field Information module and related Change or Issue records</span></li></ul></div>"
        type: string
      - name: revenue_change_status
        displayName: Revenue Change Status
        description: "<div><p id=\"isPasted\" style=\"\"><span style=\"margin: 0px;\
          \ color: rgb(0, 0, 0);\">A read-only field in InEight that reflects the\
          \ approval status of the revenue category associated with a change or issue.\
          \ It indicates whether the revenue classification tied to the issue is active,\
          \ approved, or otherwise.\_</span></p><p style=\"\"><br><span style=\"margin:\
          \ 0px;\">At Sundt, this field <strong style=\"margin: 0px; font-weight:\
          \ 700;\"><u style=\"margin: 0px;\">is not currently used as designed by\
          \ InEight.</u></strong></span><br><br></p><p style=\"\"><span style=\"margin:\
          \ 0px; font-size: 13px; color: rgb(0, 0, 0);\">Purpose / Use Case<br style=\"\
          margin: 0px;\"></span></p><ul style=\"\"><li style=\"margin: 0px;\"><span\
          \ style=\"margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\">To provide\
          \ visibility into the approval state of the assigned revenue category for\
          \ change forecasting and reporting.<br style=\"margin: 0px;\"></span></li><li\
          \ style=\"margin: 0px;\"><span style=\"margin: 0px; font-size: 13px; color:\
          \ rgb(0, 0, 0);\">To help stakeholders monitor whether revenue assumptions\
          \ tied to issues have been validated or are pending.<br style=\"margin:\
          \ 0px;\"></span></li><li style=\"margin: 0px;\"><span style=\"margin: 0px;\
          \ font-size: 13px; color: rgb(0, 0, 0);\">To support auditability and control\
          \ over how issues transition through revenue-related stages in change processes.<br\
          \ style=\"margin: 0px;\"></span></li><li style=\"margin: 0px;\"><span style=\"\
          margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\">In a fully leveraged\
          \ model, to gate downstream revenue recognition or forecast inclusion based\
          \ on the status.</span></li></ul></div>"
        type: string
      - name: aging_days
        displayName: Aging Days
        description: <p><span id="isPasted" style="">Calculates the number of elapsed
          calendar days since the Issue was created, providing a measure of its duration
          in the system for tracking and reporting purposes. This calculation stops
          when the item is changed to a status of executed, budget move, closed or
          voided.</span></p>
        type: int
      - name: change_workflow_status_type
        displayName: Change Workflow Status Type
        description: <p><strong id="isPasted">Workflow Status</strong> identifies
          the current approval workflow state of an InEight Change issue, indicating
          whether the issue is pending approval, in approval, approved, rejected,
          or otherwise progressing through the configured issue approval process.
          When workflow is configured, a new issue may remain in approval and is not
          added to the Issue Log until all required approval steps are completed.</p>
        type: string
      - name: construction_area
        displayName: Construction Area
        description: <p><strong id="isPasted">Construction Area</strong> identifies
          the project area associated with an InEight Change issue. It is used to
          reference where the change or issue occurred and is typically populated
          from configured Construction Area values, either from InEight Platform Project
          Values/Area or project-specific Change configuration depending on the project
          setup.</p>
        type: string
      - name: workflow_status_changed_by
        displayName: Workflow Status Changed By
        description: "<div><p id=\"isPasted\"><strong>Workflow Status Changed By</strong>\
          \ identifies the user who last approved or rejected the issue\u2019s pending\
          \ workflow status. This field supports workflow auditability by showing\
          \ who performed the approval or rejection action associated with the issue\u2019\
          s workflow status change.</p><p>A related companion field is <strong>Workflow\
          \ Status Changed Date</strong>, which captures the date the pending issue\
          \ was approved or rejected, while <strong>Change Workflow Status Type</strong>\
          \ captures the pending issue workflow status itself.</p></div>"
        type: string
      - name: ball_in_court
        displayName: Ball In Court
        description: <p>Identifies the responsible party currently driving the issue
          forward (e.g., contractor), supporting accountability in the change issue
          workflow.</p>
        type: string
      - name: markup
        displayName: Markup
        description: <div><p><strong id="isPasted">Markup</strong> identifies the
          total markup amount applied to an InEight Change issue. It includes all
          markups added from cost item pricing, the issue Pricing tab, and any related
          PCO or CCO pricing levels. Markups may be applied to selected subtotals
          or to the grand total and are used to calculate the priced value of the
          issue above the base cost. InEight defines <strong>Markup %</strong> separately
          as the markup amount divided by the cost.</p><p><a href="https://learn.ineight.com/Change/Content/CHNG20.5%204/Markups.htm?tocpath=Topics%7CIssues%7CCost%20item%20pricing%7C_____7">InEight
          Knowledge Library</a></p></div>
        type: decimal(28,15)
      - name: issue_submitted_date_key
        displayName: Issue Submitted Date Key
        description: <p>System-generated key used to uniquely identify this record
          for reporting.</p>
        type: timestamp
      - name: probability_percentage
        displayName: Probability Percentage
        description: "<div><p id=\"isPasted\" style=\"\"><span style=\"margin: 0px;\
          \ color: rgb(0, 0, 0);\">A numeric value (0%\u2013100%) that indicates the\
          \ likelihood that a given issue or change (e.g. PCO, CCO, or Issue) will\
          \ be approved or executed. In InEight, probability percentages are associated\
          \ with revenue categories defined in the organization\u2019s master data\
          \ and are used in revenue forecasting and change order projections.\_</span><br><br><span\
          \ style=\"margin: 0px; color: rgb(0, 0, 0);\">At Sundt, this field i<strong\
          \ style=\"margin: 0px; font-weight: 700;\"><u style=\"margin: 0px;\">s not\
          \ currently used as designed by InEight.</u></strong><br style=\"margin:\
          \ 0px;\"></span></p><p style=\"\"><span style=\"margin: 0px; font-size:\
          \ 13px; color: rgb(0, 0, 0);\">Purpose / Use Case<br style=\"margin: 0px;\"\
          ></span></p><ul style=\"\"><li style=\"margin: 0px;\"><span style=\"margin:\
          \ 0px; font-size: 13px; color: rgb(0, 0, 0);\">To weight forecasted revenue\
          \ or cost of changes by the probability of execution, thereby refining financial\
          \ projections.\_<br style=\"margin: 0px;\"></span></li><li style=\"margin:\
          \ 0px;\"><span style=\"margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\"\
          >To support scenario planning, risk analysis, and decision-making around\
          \ changes not yet approved.<br style=\"margin: 0px;\"></span></li><li style=\"\
          margin: 0px;\"><span style=\"margin: 0px; font-size: 13px; color: rgb(0,\
          \ 0, 0);\">To provide organizational-level control over how revenue assumptions\
          \ are applied in InEight Control.</span></li></ul></div>"
        type: decimal(28,15)
      - name: fact_issues_log_key
        displayName: Fact Issues Log Key
        description: <p>System-generated key used to uniquely identify this record
          for reporting.</p>
        type: bigint
      - name: assigned_user
        displayName: Assigned User
        description: '<div><p id="isPasted"><span style="margin: 0px; color: rgb(0,
          0, 0);">Identifies the individual responsible for managing, reviewing, or
          progressing an issue, change, or related record within InEight. It designates
          ownership of the item to ensure accountability, follow-up, and workflow
          continuity throughout its lifecycle.</span></p><p><span style="margin: 0px;
          font-size: 13px; color: rgb(0, 0, 0);"><br style="margin: 0px;"></span></p><p><span
          style="margin: 0px; font-size: 13px; color: rgb(0, 0, 0);">Purpose / Use
          Case</span></p><ul><li style="margin: 0px;"><span style="margin: 0px; font-size:
          13px; color: rgb(0, 0, 0);">To clearly define responsibility for each issue,
          change, or task within project controls and change management workflows.</span></li><li
          style="margin: 0px;"><span style="margin: 0px; font-size: 13px; color: rgb(0,
          0, 0);">To enable tracking of workload distribution and task ownership across
          project teams.</span></li><li style="margin: 0px;"><span style="margin:
          0px; font-size: 13px; color: rgb(0, 0, 0);">To support automated notifications,
          approvals, and routing in InEight workflows.</span></li><li style="margin:
          0px;"><span style="margin: 0px; font-size: 13px; color: rgb(0, 0, 0);">To
          facilitate reporting on performance metrics such as turnaround times, open
          actions, and outstanding reviews.</span></li></ul></div>'
        type: string
      - name: billing_markup
        displayName: Billing Markup
        description: <p><strong id="isPasted">Billings Markup</strong> is the markup
          percentage applied to billable line items, such as time sheet charges, to
          calculate the amount billed to the client. Markups may be configured as
          default percentages or as exceptions by line-item type and can be shown
          separately on invoices or included in the fully marked-up billing amount.</p>
        type: decimal(28,15)
      - name: created_date_key
        displayName: Created Date Key
        description: <p>Date the change issue was created in the system, establishing
          the start point for tracking change workflow timing and history.</p>
        type: timestamp
      - name: custom_field_1
        displayName: Custom Field 1
        description: "<div><p id=\"isPasted\" style=\"\"><span style=\"margin: 0px;\
          \ color: rgb(0, 0, 0);\">Refers to user-configurable fields that extend\
          \ the default schema of the InEight Change module. These fields allow the\
          \ organization to add additional attributes or metadata beyond the built-in\
          \ fields. InEight supports custom drop-down lists (custom lists) and custom\
          \ fields that are specific to Issues, CORs, or CCOs. \_These fields are\
          \ <strong style=\"margin: 0px; font-weight: 700;\">free text fields</strong>.</span></p><p\
          \ style=\"\"><span style=\"margin: 0px; font-size: 13px; color: rgb(0, 0,\
          \ 0);\"><br style=\"margin: 0px;\"></span></p><p style=\"\"><span style=\"\
          margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\">Purpose / Use Case<br\
          \ style=\"margin: 0px;\"></span></p><ul style=\"\"><li style=\"margin: 0px;\"\
          ><span style=\"margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\">To capture\
          \ additional, project-specific data that is not supported by the standard\
          \ InEight Change fields (e.g. risk category, region, internal classification).<br\
          \ style=\"margin: 0px;\"></span></li><li style=\"margin: 0px;\"><span style=\"\
          margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\">To allow flexibility\
          \ in the Change module so different projects can track unique attributes\
          \ relevant to their workflows.<br style=\"margin: 0px;\"></span></li><li\
          \ style=\"margin: 0px;\"><span style=\"margin: 0px; font-size: 13px; color:\
          \ rgb(0, 0, 0);\">To integrate extra metadata into reporting and analytics\
          \ (Power BI, dashboards) tied to issues or change records.<br style=\"margin:\
          \ 0px;\"></span></li><li style=\"margin: 0px;\"><span style=\"margin: 0px;\
          \ font-size: 13px; color: rgb(0, 0, 0);\">In a mature usage model, custom\
          \ fields can support filtering, grouping, and trend analysis of issues based\
          \ on nonstandard classification schemes.</span></li></ul></div>"
        type: string
      - name: has_work_started
        displayName: Has Work Started?
        description: "<div><p id=\"isPasted\" style=\"\"><span style=\"margin: 0px;\
          \ color: rgb(0, 0, 0);\">A status indicator used to identify whether physical\
          \ work associated with an issue has begun in the field. It provides visibility\
          \ into whether the affected activity or scope item is already underway,\
          \ pending, or completed at the time the issue is logged or reviewed within\
          \ the Change module.</span></p><p style=\"\"><br style=\"margin: 0px;\"\
          ></p><p style=\"\"><span style=\"margin: 0px; font-size: 13px; color: rgb(0,\
          \ 0, 0);\">Purpose / Use Case</span></p><ul style=\"\"><li style=\"margin:\
          \ 0px;\"><span style=\"margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\"\
          >To track whether work related to an issue has started, aiding in the assessment\
          \ of potential cost and schedule impacts.</span></li><li style=\"margin:\
          \ 0px;\"><span style=\"margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\"\
          >To support determination of issue timing \u2014 distinguishing between\
          \ proactive and reactive change management.</span><span style=\"margin:\
          \ 0px; font-size: 13px; color: rgb(0, 0, 0);\"><br style=\"margin: 0px;\"\
          ></span></li><li style=\"margin: 0px;\"><span style=\"margin: 0px; font-size:\
          \ 13px; color: rgb(0, 0, 0);\">To help project teams evaluate entitlement\
          \ for time extensions, delay claims, or rework costs.</span><span style=\"\
          margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\"><br style=\"margin:\
          \ 0px;\"></span></li><li style=\"margin: 0px;\"><span style=\"margin: 0px;\
          \ font-size: 13px; color: rgb(0, 0, 0);\">To improve communication between\
          \ field operations and project controls by confirming the status of affected\
          \ work.</span><span style=\"margin: 0px; font-size: 13px; color: rgb(0,\
          \ 0, 0);\"><br style=\"margin: 0px;\"></span></li><li style=\"margin: 0px;\"\
          ><span style=\"margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\">To assist\
          \ with audit and risk assessment by recording the issue\u2019s relation\
          \ to work progress.</span></li></ul></div>"
        type: string
      - name: revenue_category
        displayName: Revenue Category
        description: "<div><p id=\"isPasted\" style=\"\"><span style=\"margin: 0px;\
          \ color: rgb(0, 0, 0);\">Identifies the classification of potential or realized\
          \ revenue associated with an issue. In InEight, revenue categories are defined\
          \ within the organization\u2019s master data and are selectable from a drop-down\
          \ list. This field is intended to categorize issues based on how they contribute\
          \ to project revenue recognition or adjustment.</span><span style=\"margin:\
          \ 0px; font-size: 13px; color: rgb(0, 0, 0);\"><br style=\"margin: 0px;\"\
          ></span><br><span style=\"margin: 0px; font-size: 13px; color: rgb(0, 0,\
          \ 0);\">At Sundt, this field is <strong style=\"margin: 0px; font-weight:\
          \ 700;\"><u style=\"margin: 0px;\">not currently used as designed by InEight</u></strong>.\
          \ Instead, it serves a limited purpose\u2014to indicate when an issue has\
          \ been executed as a Change Order, supporting alignment between issue management\
          \ and contract execution records.</span></p><p style=\"\"><span style=\"\
          margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\"><br style=\"margin:\
          \ 0px;\"></span></p><p style=\"\"><span style=\"margin: 0px; font-size:\
          \ 13px; color: rgb(0, 0, 0);\">Purpose / Use Case</span><span style=\"margin:\
          \ 0px; font-size: 13px; color: rgb(0, 0, 0);\"><br style=\"margin: 0px;\"\
          ></span></p><ul style=\"\"><li style=\"margin: 0px;\"><span style=\"margin:\
          \ 0px; font-size: 13px; color: rgb(0, 0, 0);\">To categorize revenue-related\
          \ issues for tracking and reporting (InEight intended use).</span><span\
          \ style=\"margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\"><br style=\"\
          margin: 0px;\"></span></li><li style=\"margin: 0px;\"><span style=\"margin:\
          \ 0px; font-size: 13px; color: rgb(0, 0, 0);\">To identify issues that have\
          \ progressed to executed commercial change (Sundt current use).</span><span\
          \ style=\"margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\"><br style=\"\
          margin: 0px;\"></span></li><li style=\"margin: 0px;\"><span style=\"margin:\
          \ 0px; font-size: 13px; color: rgb(0, 0, 0);\">To support potential future\
          \ integration with financial reporting or ERP systems for revenue recognition.</span><span\
          \ style=\"margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\"><br style=\"\
          margin: 0px;\"></span></li><li style=\"margin: 0px;\"><span style=\"margin:\
          \ 0px; font-size: 13px; color: rgb(0, 0, 0);\">To maintain consistency and\
          \ audit visibility when an issue transitions into an executed contract change.</span></li></ul></div>"
        type: string
      - name: custom_field_4
        displayName: Custom Field 4
        description: "<div><p id=\"isPasted\" style=\"\"><span style=\"margin: 0px;\
          \ color: rgb(0, 0, 0);\">Refers to user-configurable fields that extend\
          \ the default schema of the InEight Change module. These fields allow the\
          \ organization to add additional attributes or metadata beyond the built-in\
          \ fields. InEight supports custom drop-down lists (custom lists) and custom\
          \ fields that are specific to Issues, CORs, or CCOs. \_These fields are\
          \ <strong style=\"margin: 0px; font-weight: 700;\">free text fields</strong>.</span></p><p\
          \ style=\"\"><span style=\"margin: 0px; font-size: 13px; color: rgb(0, 0,\
          \ 0);\"><br style=\"margin: 0px;\"></span></p><p style=\"\"><span style=\"\
          margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\">Purpose / Use Case<br\
          \ style=\"margin: 0px;\"></span></p><ul style=\"\"><li style=\"margin: 0px;\"\
          ><span style=\"margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\">To capture\
          \ additional, project-specific data that is not supported by the standard\
          \ InEight Change fields (e.g. risk category, region, internal classification).<br\
          \ style=\"margin: 0px;\"></span></li><li style=\"margin: 0px;\"><span style=\"\
          margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\">To allow flexibility\
          \ in the Change module so different projects can track unique attributes\
          \ relevant to their workflows.<br style=\"margin: 0px;\"></span></li><li\
          \ style=\"margin: 0px;\"><span style=\"margin: 0px; font-size: 13px; color:\
          \ rgb(0, 0, 0);\">To integrate extra metadata into reporting and analytics\
          \ (Power BI, dashboards) tied to issues or change records.<br style=\"margin:\
          \ 0px;\"></span></li><li style=\"margin: 0px;\"><span style=\"margin: 0px;\
          \ font-size: 13px; color: rgb(0, 0, 0);\">In a mature usage model, custom\
          \ fields can support filtering, grouping, and trend analysis of issues based\
          \ on nonstandard classification schemes.</span></li></ul></div>"
        type: string
      - name: issue_start_date_key
        displayName: Issue Start Date Key
        description: <p>System-generated key used to uniquely identify this record
          for reporting.</p>
        type: timestamp
      - name: modified_date_key
        displayName: Modified Date Key
        description: <p>Last modified timestamp across all fields, supporting auditability
          and incremental reporting checks for change issue updates.</p>
        type: timestamp
      - name: daily_plan_id
        displayName: Daily Plan Id
        description: "<div><p id=\"isPasted\" style=\"\"><span style=\"margin: 0px;\
          \ color: rgb(0, 0, 0);\">The unique identifier assigned to each daily plan\
          \ record within InEight\u2019s Field Information module. When linked to\
          \ an Issue in Change, it connects the identified field condition or event\
          \ to the specific day and plan in which it was discovered, documented, or\
          \ affected. This relationship establishes traceability between daily field\
          \ activities and subsequent change management actions.</span></p><p style=\"\
          \"><span style=\"margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\"><br\
          \ style=\"margin: 0px;\"></span></p><p style=\"\"><span style=\"margin:\
          \ 0px; font-size: 13px; color: rgb(0, 0, 0);\"><strong style=\"margin: 0px;\
          \ font-weight: 700;\">Purpose / Use Case</strong></span></p><ul style=\"\
          \"><li style=\"margin: 0px;\"><span style=\"margin: 0px; font-size: 13px;\
          \ color: rgb(0, 0, 0);\">To provide a direct link between daily field events\
          \ and issues that may lead to a contract change, claim, or budget adjustment.</span></li><li\
          \ style=\"margin: 0px;\"><span style=\"margin: 0px; font-size: 13px; color:\
          \ rgb(0, 0, 0);\">To ensure that every issue recorded under the Change module\
          \ can be traced back to the specific workday and construction context in\
          \ which it occurred.</span></li><li style=\"margin: 0px;\"><span style=\"\
          margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\">To support forensic\
          \ analysis, root cause evaluation, and substantiation of change requests\
          \ or claims.</span></li><li style=\"margin: 0px;\"><span style=\"margin:\
          \ 0px; font-size: 13px; color: rgb(0, 0, 0);\">To enable integration between\
          \ Field Information (daily plans) and Change Management data for consistent\
          \ reporting and auditability.</span></li><li style=\"margin: 0px;\"><span\
          \ style=\"margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\">To assist\
          \ project teams in identifying trends\u2014such as recurring issues in specific\
          \ construction areas, crews, or activities.</span><span style=\"margin:\
          \ 0px; font-size: 13px; color: rgb(0, 0, 0);\">\_</span></li></ul></div>"
        type: string
      - name: net_value
        displayName: Net Value
        description: <p><strong id="isPasted">Net Value</strong> identifies the overall
          value of an InEight Change issue after deductions are applied to the current
          value. It represents the net priced amount for the issue by reducing or
          allocating value from one or more cost items; for example, a current value
          of $10,000 with deductions of -$7,500 results in a net value of $2,500.</p>
        type: decimal(28,15)
      - name: allowance_category
        displayName: Allowance Category
        description: '<div><p id="isPasted" style=""><span style="margin: 0px; color:
          rgb(0, 0, 0);">Identifies the classification or purpose of a defined project
          allowance within InEight. It provides a structured way to categorize allowances
          that are included in the contract value to cover specific anticipated costs,
          materials, or activities, typically where details are not fully defined
          at the time of contract execution.</span></p><p style=""><span style="margin:
          0px; font-size: 13px; color: rgb(0, 0, 0);"><br style="margin: 0px;"></span></p><p
          style=""><span style="margin: 0px; font-size: 13px; color: rgb(0, 0, 0);">Purpose
          / Use Case</span></p><ul style=""><li style="margin: 0px;"><span style="margin:
          0px; font-size: 13px; color: rgb(0, 0, 0);">To organize and track contract
          allowances by their intended use or cost purpose.</span></li><li style="margin:
          0px;"><span style="margin: 0px; font-size: 13px; color: rgb(0, 0, 0);">To
          improve visibility of allowance utilization across cost codes, change management,
          and forecasting.</span></li><li style="margin: 0px;"><span style="margin:
          0px; font-size: 13px; color: rgb(0, 0, 0);">To distinguish between different
          types of allowances (e.g., design, owner-directed, subcontractor, or contingency-based).</span></li><li
          style="margin: 0px;"><span style="margin: 0px; font-size: 13px; color: rgb(0,
          0, 0);">To support reporting and control of allowance-related expenditures
          and authorizations (e.g., AUAs).</span></li><li style="margin: 0px;"><span
          style="margin: 0px; font-size: 13px; color: rgb(0, 0, 0);">To enable analysis
          of allowance performance, burn rate, and adjustments over the project lifecycle.</span></li></ul></div>'
        type: string
      - name: custom_field_3
        displayName: Custom Field 3
        description: "<div><p id=\"isPasted\" style=\"\"><span style=\"margin: 0px;\
          \ color: rgb(0, 0, 0);\">Refers to user-configurable fields that extend\
          \ the default schema of the InEight Change module. These fields allow the\
          \ organization to add additional attributes or metadata beyond the built-in\
          \ fields. InEight supports custom drop-down lists (custom lists) and custom\
          \ fields that are specific to Issues, CORs, or CCOs. \_These fields are\
          \ <strong style=\"margin: 0px; font-weight: 700;\">free text fields</strong>.</span></p><p\
          \ style=\"\"><span style=\"margin: 0px; font-size: 13px; color: rgb(0, 0,\
          \ 0);\"><br style=\"margin: 0px;\"></span></p><p style=\"\"><span style=\"\
          margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\">Purpose / Use Case<br\
          \ style=\"margin: 0px;\"></span></p><ul style=\"\"><li style=\"margin: 0px;\"\
          ><span style=\"margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\">To capture\
          \ additional, project-specific data that is not supported by the standard\
          \ InEight Change fields (e.g. risk category, region, internal classification).<br\
          \ style=\"margin: 0px;\"></span></li><li style=\"margin: 0px;\"><span style=\"\
          margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\">To allow flexibility\
          \ in the Change module so different projects can track unique attributes\
          \ relevant to their workflows.<br style=\"margin: 0px;\"></span></li><li\
          \ style=\"margin: 0px;\"><span style=\"margin: 0px; font-size: 13px; color:\
          \ rgb(0, 0, 0);\">To integrate extra metadata into reporting and analytics\
          \ (Power BI, dashboards) tied to issues or change records.<br style=\"margin:\
          \ 0px;\"></span></li><li style=\"margin: 0px;\"><span style=\"margin: 0px;\
          \ font-size: 13px; color: rgb(0, 0, 0);\">In a mature usage model, custom\
          \ fields can support filtering, grouping, and trend analysis of issues based\
          \ on nonstandard classification schemes.</span></li></ul></div>"
        type: string
      - name: scope_status
        displayName: Scope Status
        description: '<div><p id="isPasted" style=""><span style="margin: 0px; color:
          rgb(0, 0, 0);">Identifies whether an issue, change, or work item falls within
          the contracted scope of work (In Scope) or outside the contractual obligations
          (Out of Scope). It provides a clear distinction between work that is included
          in the baseline agreement and work that may require additional authorization,
          pricing, or contractual modification.</span></p><p style=""><br style="margin:
          0px;"></p><p style=""><span style="margin: 0px; font-size: 13px; color:
          rgb(0, 0, 0);">Purpose / Use Case</span></p><ul style=""><li style="margin:
          0px;"><span style="margin: 0px; font-size: 13px; color: rgb(0, 0, 0);">To
          clarify whether identified issues or activities are covered under the existing
          contract.</span></li><li style="margin: 0px;"><span style="margin: 0px;
          font-size: 13px; color: rgb(0, 0, 0);">To support cost and change management
          by distinguishing potential change orders or extra work.</span></li><li
          style="margin: 0px;"><span style="margin: 0px; font-size: 13px; color: rgb(0,
          0, 0);">To drive consistent reporting and communication across project teams,
          clients, and subcontractors.</span></li><li style="margin: 0px;"><span style="margin:
          0px; font-size: 13px; color: rgb(0, 0, 0);">To assist in project controls,
          claim management, and scope validation processes.</span></li></ul></div>'
        type: string
      - name: margin
        displayName: Margin
        description: <div><p><strong id="isPasted">Margin</strong> identifies the
          issue-level markup amount or percentage applied during pricing to account
          for profit or other contract-defined margin requirements. In InEight Change,
          margin is handled as a markup within the issue pricing structure and may
          be applied to section subtotals or the grand total, then included in the
          pricing summary used to determine the proposed or agreed value for the issue.</p><p>Sundt
          specifically tracks margin on a 1387 Cost Type (Cost Category) and does
          calculate margin in the platform as InEight is designed.</p></div>
        type: decimal(28,15)
      - name: custom_field_2
        displayName: Custom Field 2
        description: '<div><p id="isPasted"><span style="margin: 0px; color: rgb(0,
          0, 0);">Refers to user-configurable fields that extend the default schema
