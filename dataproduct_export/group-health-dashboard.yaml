    fact_cor_log_v:
      name: fact_cor_log_v
      displayName: COR LOG Transactions
      description: <div><p>The `fact_cor_log_v` is a view table that contains log
        data related to project management, including details about change orders
        (CORs), projects, clients, pricing, revenue, and other financial information.
        This view likely serves as a central repository for tracking updates and changes
        to project-related data over time.</p><p>Some questions that could be answered
        by joining this table with others:</p><p>- What are the details of a specific
        change order, including its status, pricing, and revenue information? Join
        on prod.project_management_v.dim_cor_v.dim_cor_key = prod.project_management_v.fact_cor_log_v.dim_cor_key</p></div>
      schema:
      - name: etl_gold_timestamp
        displayName: Etl Gold Timestamp
        description: <p>The date and time when this business event occurred.</p>
        type: timestamp
      - name: pricing_status
        displayName: Pricing Status
        description: "<p>The Pricing Status\_<span id=\"isPasted\">indicates where\
          \ a Change Order Request (COR) stands in the pricing lifecycle \u2014 specifically\
          \ whether cost impacts have been developed, reviewed, and agreed upon.</span></p>"
        type: string
      - name: dim_cco_key
        displayName: Dim Contract Completion Override Key
        description: <p>System-generated key used to uniquely identify this record
          for reporting.</p>
        type: bigint
      - name: is_active
        displayName: Is Active
        description: <div><p><span id="isPasted">Indicates whether the record is currently
          active. Active records are visible in the UI.</span></p></div>
        type: boolean
      - name: custom_field_2
        displayName: Custom Field 2
        description: '<div><div><p id="isPasted"><span style="margin: 0px; color:
          rgb(0, 0, 0);">Refers to user-configurable fields that extend the default
          schema of the InEight Change module. These fields allow the organization
          to add additional attributes or metadata beyond the built-in fields. InEight
          supports custom drop-down lists (custom lists) and custom fields that are
          specific to Issues, CORs, or CCOs. These fields are <strong style="margin:
          0px; font-weight: 700;">free text fields</strong>.</span></p><p><span style="margin:
          0px; font-size: 13px; color: rgb(0, 0, 0);"><br style="margin: 0px;"></span></p><p><span
          style="margin: 0px; font-size: 13px; color: rgb(0, 0, 0);">Purpose / Use
          Case<br style="margin: 0px;"></span></p><ul><li style="margin: 0px;"><span
          style="margin: 0px; font-size: 13px; color: rgb(0, 0, 0);">To capture additional,
          project-specific data that is not supported by the standard InEight Change
          fields (e.g. risk category, region, internal classification).<br style="margin:
          0px;"></span></li><li style="margin: 0px;"><span style="margin: 0px; font-size:
          13px; color: rgb(0, 0, 0);">To allow flexibility in the Change module so
          different projects can track unique attributes relevant to their workflows.<br
          style="margin: 0px;"></span></li><li style="margin: 0px;"><span style="margin:
          0px; font-size: 13px; color: rgb(0, 0, 0);">To integrate extra metadata
          into reporting and analytics (Power BI, dashboards) tied to issues or change
          records.<br style="margin: 0px;"></span></li><li style="margin: 0px;"><span
          style="margin: 0px; font-size: 13px; color: rgb(0, 0, 0);">In a mature usage
          model, custom fields can support filtering, grouping, and trend analysis
          of issues based on nonstandard classification schemes.</span></li></ul></div><p><br></p></div>'
        type: string
      - name: revenue_change_status
        displayName: Revenue Change Status
        description: <div><p>Status of the record's revenue category or revenue change
          for forecasting and reporting purposes.</p></div>
        type: string
      - name: date_price_to_client
        displayName: Date Price To Client
        description: "<p>\u201CDate Priced to Client\u201D identifies the date on\
          \ which pricing associated with a change, issue, Change Order Request (COR),\
          \ or Client Change Order (CCO) was formally submitted or communicated to\
          \ the client. This field provides traceability for when the financial impact\
          \ of a change was presented for client review, negotiation, or approval.</p>"
