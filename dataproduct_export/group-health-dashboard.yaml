          \ internal classification).<br style=\"margin: 0px;\"></span></li><li style=\"\
          margin: 0px;\"><span style=\"margin: 0px; font-size: 13px; color: rgb(0,\
          \ 0, 0);\">To allow flexibility in the Change module so different projects\
          \ can track unique attributes relevant to their workflows.<br style=\"margin:\
          \ 0px;\"></span></li><li style=\"margin: 0px;\"><span style=\"margin: 0px;\
          \ font-size: 13px; color: rgb(0, 0, 0);\">To integrate extra metadata into\
          \ reporting and analytics (Power BI, dashboards) tied to issues or change\
          \ records.<br style=\"margin: 0px;\"></span></li><li style=\"margin: 0px;\"\
          ><span style=\"margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\">In a\
          \ mature usage model, custom fields can support filtering, grouping, and\
          \ trend analysis of issues based on nonstandard classification schemes.</span></li></ul></div><p><br></p></div>"
