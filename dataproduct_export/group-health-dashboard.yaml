    fact_cco_log_v:
      name: fact_cco_log_v
      displayName: CCO LOG Transactions
      description: <div><p>The `fact_cco_log_v` table is a view table that tracks
        change control orders (CCOs) for projects. It contains details about CCOs
        such as the project ID, CCO status, cost and revenue changes, time extensions,
        and other related information.</p><p>There don't appear to be any known joins
        with this table in the catalog. Here are some questions you might be able
        to answer with this table alone:</p><p>- What are the different statuses of
        CCOs and their distribution?</p><p>- What is the distribution of revenue change
        statuses for CCOs?</p><p>- What is the range of cost and revenue changes associated
        with CCOs?</p><p>- What is the distribution of time extension types and requested/approved
        extension days for CCOs?</p></div>
      schema:
      - name: sec_project
        displayName: Sec Project
        description: <div><p>User-facing project display number used to identify the
          related or associated project in the UI, reports, and integrations.</p></div>
        type: string
      - name: etl_gold_timestamp
        displayName: Etl Gold Timestamp
        description: <p>The date and time when this business event occurred.</p>
        type: timestamp
      - name: project_id
        displayName: Project Id
        description: <p>System-generated unique identifier for a project.</p>
        type: bigint
      - name: current_value
        displayName: Current Value
        description: <p>The sum of <a class="fr-deletable" data-oid="78509" data-otype="attribute"
          href="/app/attribute/78509"></a> from all Issues associated to a CCO. <span
          id="isPasted">The value that the Current Value displays comes from the sum
          of the Self Perform and Vendor subtotals, plus any lump sum adjustments,
          if any.</span></p>
        type: decimal(28,15)
      - name: cco_id
        displayName: Contract Completion Override Id
        description: <p><span id="isPasted" style="">System-generated unique identifier
          for a Client Change Order.</span></p>
        type: bigint
      - name: cco_name
        displayName: Contract Completion Override Name
        description: <p><span id="isPasted" style="">Name or title used to describe
          a Client Change Order.</span></p>
        type: string
      - name: cco_status
        displayName: Contract Completion Override Status
        description: <p><span id="isPasted" style="">Current execution status of the
          Client Change Order (CCO).</span></p>
        type: string
      - name: aging_days
        displayName: Aging Days
        description: <p>Calculates the number of calendar days elapsed from the CCO
          Start Date through the current date or closed date, whichever is earlier.
          A CCO is considered closed when the status is Executed, Closed or Voided.</p>
        type: int
      - name: is_active
        displayName: Is Active
        description: <p><span id="isPasted" style="">Indicates whether the record
          is currently active. Active records are visible in the UI.</span></p>
        type: boolean
      - name: dim_cco_key
        displayName: Dim Contract Completion Override Key
        description: <p>System-generated key used to uniquely identify this record
          for reporting.</p>
        type: bigint
      - name: date_key_client_notified
        displayName: Date Key Client Notified
        description: <p>Date associated with the client being notified.</p>
        type: timestamp
      - name: billing_markup
        displayName: Billing Markup
        description: "<p>The sum total of the the Adjusted Billable Amount less Adjusted\
          \ Cost in the Cost Item Pricing screen for all Issues linked to a <a class=\"\
          fr-deletable\" data-oid=\"52\" data-otype=\"glossary_term\" href=\"/app/document/52\"\
          ></a>.\_</p>"
        type: decimal(28,15)
      - name: dim_project_key
        displayName: Dim Project Key
        description: <p>System-generated key used to uniquely identify this record
          for reporting.</p>
        type: bigint
      - name: deduction
        displayName: Deduction
        description: <p>The sum of all <a data-oid="79383" data-otype="attribute"
          href="/app/attribute/79383" id="isPasted"></a> from all Issues associate
          to the CCO.</p>
        type: decimal(28,15)
      - name: cost
        displayName: Cost
        description: "<p>Sum total dollar amount in cost item pricing associated with\
          \ the <a class=\"fr-deletable\" data-oid=\"52\" data-otype=\"glossary_term\"\
          \ href=\"/app/document/52\"></a>\_before any deductions.</p>"
        type: decimal(28,15)
      - name: control_change_register_id
        displayName: Control Change Register Id
        description: <p>Project-specific identifier for a <a class="fr-deletable"
          data-oid="52" data-otype="glossary_term" href="/app/document/52"></a>'s
          linked entry in the Control Change Register.</p>
        type: decimal(28,15)
      - name: change_order_number
        displayName: Change Order Number
        description: "<p><span id=\"isPasted\" style=\"\">Unique user-generated identifier\
          \ for\_</span><a data-oid=\"52\" data-otype=\"glossary_term\" href=\"https://sundt.alationcloud.com/app/document/52\"\
          \ style=\"\"></a><span style=\"\">, distinct from the system-generated CCO\
          \ ID. Referred to as <a class=\"fr-deletable\" data-oid=\"77718\" data-otype=\"\
          attribute\" href=\"/app/attribute/77718\"></a> elsewhere.</span></p>"
        type: string
      - name: net_value
        displayName: Net Value
        description: <p>Overall value of the change after deductions are applied.</p>
        type: decimal(28,15)
      - name: created_date_key
        displayName: Created Date Key
        description: <p>Date the CCO was created, establishing the start of the change
          order timeline used for aging and workflow tracking.</p>
        type: timestamp
      - name: revenue_change_status
        displayName: Revenue Change Status
        description: <p>Current status of <a data-oid="52" data-otype="glossary_term"
          href="/app/document/52" id="isPasted"></a> revenue for forecasting purposes
          in Control, driven by the Revenue Category selection until the CCO Status
          is 'Executed,' at which point the Revenue Change Status will automatically
          update to 'Executed' to match.</p>
        type: string
      - name: date_key_price_to_client
        displayName: Date Key Price To Client
        description: <p>Date associated with sending price to client.</p>
