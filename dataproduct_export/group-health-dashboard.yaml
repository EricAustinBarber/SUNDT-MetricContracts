          \ current use).</span><span style=\"margin: 0px; font-size: 13px; color:\
          \ rgb(0, 0, 0);\"><br style=\"margin: 0px;\"></span></li><li style=\"margin:\
          \ 0px;\"><span style=\"margin: 0px; font-size: 13px; color: rgb(0, 0, 0);\"\
          >To support potential future integration with financial reporting or ERP\
          \ systems for revenue recognition.</span><span style=\"margin: 0px; font-size:\
          \ 13px; color: rgb(0, 0, 0);\"><br style=\"margin: 0px;\"></span></li><li\
          \ style=\"margin: 0px;\"><span style=\"margin: 0px; font-size: 13px; color:\
          \ rgb(0, 0, 0);\">To maintain consistency and audit visibility when an issue\
          \ transitions into an executed contract change.</span></li></ul></div></div>"
        type: string
      - name: start_date_key
        displayName: Start Date Key
        description: <p>System-generated key used to uniquely identify this record
