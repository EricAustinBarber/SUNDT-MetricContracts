      - name: probability_percentage
        displayName: Probability Percentage
        description: "<div><div><p id=\"isPasted\"><span style=\"margin: 0px; color:\
          \ rgb(0, 0, 0);\">A numeric value (0%\u2013100%) that indicates the likelihood\
          \ that a given issue or change (e.g. PCO, CCO, or Issue) will be approved\
          \ or executed. In InEight, probability percentages are associated with revenue\
          \ categories defined in the organization\u2019s master data and are used\
          \ in revenue forecasting and change order projections.\_</span><br><br><span\
          \ style=\"margin: 0px; color: rgb(0, 0, 0);\">At Sundt, this field i<strong\
          \ style=\"margin: 0px; font-weight: 700;\"><u style=\"margin: 0px;\">s not\
