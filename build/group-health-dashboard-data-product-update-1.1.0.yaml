  metadata:
    metrics:
      fin_ap_31_60:
        displayName: AP Aging 31–60 Days
        description: Accounts payable balance in the 31–60 day aging bucket.
        expression: SUM(fact_accounts_payable_v.between_31_and_60)
        type: numeric
        columns:
        - fact_accounts_payable_v.between_31_and_60
      fin_ap_over_90:
        displayName: AP Aging > 90 Days
        description: Accounts payable balance outstanding more than 90 days.
        expression: SUM(fact_accounts_payable_v.greater_than_90)
        type: numeric
        columns:
        - fact_accounts_payable_v.greater_than_90
      fin_ar_31_60:
        displayName: AR Aging 31–60 Days
        description: Accounts receivable balance in the 31–60 day aging bucket.
        expression: SUM(fact_accounts_receivable_v.between_31_and_60)
        type: numeric
        columns:
        - fact_accounts_receivable_v.between_31_and_60
      fin_ar_61_90:
        displayName: AR Aging 61–90 Days
        description: Accounts receivable balance in the 61–90 day aging bucket.
        expression: SUM(fact_accounts_receivable_v.between_61_and_90)
        type: numeric
        columns:
        - fact_accounts_receivable_v.between_61_and_90
      fin_ar_grand_total:
        displayName: Accounts Receivable — Grand Total
        description: Total outstanding accounts receivable across all aging buckets
          for a project.
        expression: SUM(fact_accounts_receivable_v.grand_total)
        type: numeric
        columns:
        - fact_accounts_receivable_v.grand_total
      fin_ar_over_90:
        displayName: AR Aging > 90 Days
        description: Accounts receivable balance outstanding more than 90 days; a
          key financial health risk indicator.
        expression: SUM(fact_accounts_receivable_v.greater_than_90)
        type: numeric
        columns:
        - fact_accounts_receivable_v.greater_than_90
      fin_earned_profit_pct_ytd:
        displayName: Earned Profit YTD %
        description: Year-to-date earned profit as a percentage of earned revenue.
        expression: DIVIDE(SUM(fact_executive_summary_v.earned_year_to_date_profit),
          SUM(fact_executive_summary_v.earned_year_to_date_revenue))
        type: numeric
        columns:
        - fact_executive_summary_v.earned_year_to_date_profit
        - fact_executive_summary_v.earned_year_to_date_revenue
      fin_earned_revenue_ytd:
        displayName: Earned Revenue YTD
        description: Year-to-date earned revenue for a project, used in financial
          health scoring.
        expression: SUM(fact_executive_summary_v.earned_year_to_date_revenue)
        type: numeric
        columns:
        - fact_executive_summary_v.earned_year_to_date_revenue
      fin_mpr_cost_vs_budget_variance:
        displayName: MPR Cost vs Budget Variance
        description: Variance between MPR actual cost and approved budget from the
          Monthly Progress Report.
        expression: SUM(fact_cost_vs_budget_summary_v.actual_cost) - SUM(fact_cost_vs_budget_summary_v.approved_budget)
        type: numeric
        columns:
        - fact_cost_vs_budget_summary_v.actual_cost
        - fact_cost_vs_budget_summary_v.approved_budget
      fin_project_contract_final:
        displayName: Project Contract Final (Total)
        description: Sum of control budget total cost plus issues log adjustments,
          representing the final contract value.
        expression: SUM(fact_control_budget_v.cb_total_cost) + SUM(fact_issues_log_v.adjustment_amount)
        type: numeric
        columns:
        - fact_control_budget_v.cb_total_cost
        - fact_issues_log_v.adjustment_amount
      qual_deficiencies_sundt:
        displayName: Total Deficiencies (Sundt-Responsible)
        description: Count of deficiency items where the responsible party is Sundt.
        expression: COUNT(fact_deficiency_v.deficiency_id) FILTER (fact_deficiency_v.responsible_party
          = 'Sundt')
        type: numeric
        columns:
        - fact_deficiency_v.deficiency_id
        - fact_deficiency_v.responsible_party
      qual_total_deficiencies:
        displayName: Total Deficiencies
        description: Count of all open and closed deficiency/punchlist items recorded
          for a project.
        expression: COUNT(fact_deficiency_v.deficiency_id)
        type: numeric
        columns:
        - fact_deficiency_v.deficiency_id
      saf_cvis_score:
        displayName: CVIS Implementation Score
        description: Average CVIS (Corrective and Verification Inspection System)
          implementation score across projects.
        expression: AVERAGE(fact_cvis_walk_v.implementation_score)
        type: numeric
        columns:
        - fact_cvis_walk_v.implementation_score
      saf_psli_compliance:
        displayName: PSLI Compliance Rate
        description: Percentage of Pre-Shift Logistical Inspections (PSLI) completed
          vs. required.
        expression: DIVIDE(COUNT(fact_psli_v.completed_psli), COUNT(fact_psli_v.required_psli))
        type: numeric
        columns:
        - fact_psli_v.completed_psli
        - fact_psli_v.required_psli
      saf_stcky_success_rate:
        displayName: STCKY Walk Success Rate
        description: Percentage of STCKY safety walks that passed all safety criteria.
        expression: DIVIDE(SUM(fact_stcky_walk_v.successful_walks), COUNT(fact_stcky_walk_v.walk_id))
        type: numeric
        columns:
        - fact_stcky_walk_v.successful_walks
        - fact_stcky_walk_v.walk_id
      saf_total_incidents:
        displayName: Total Safety Incidents
        description: Count of all safety incident events recorded for a project in
          the reporting period.
        expression: COUNT(fact_incident_event_v.incident_event_id)
        type: numeric
        columns:
        - fact_incident_event_v.incident_event_id
      saf_trir:
        displayName: Total Recordable Incident Rate (TRIR)
        description: OSHA TRIR = (recordable incidents × 200,000) / total hours worked.
          Core safety KPI.
        expression: DIVIDE(COUNT(fact_incident_v.incident_id) * 200000, SUM(fact_weekly_labor_hours_by_project_v.hours_worked))
        type: numeric
        columns:
        - fact_incident_v.incident_id
        - fact_weekly_labor_hours_by_project_v.hours_worked
      sch_baseline_vs_planned_eac:
        displayName: Baseline vs Planned EAC Variance
        description: Difference between baseline estimated cost at completion and
          current planned EAC.
        expression: SUM(fact_task_baseline_current_v.baseline_eac) - SUM(fact_task_current_v.planned_eac)
        type: numeric
        columns:
        - fact_task_baseline_current_v.baseline_eac
        - fact_task_current_v.planned_eac
      sch_min_float:
        displayName: Minimum Float (Days)
        description: Minimum total float across critical-path tasks. Low or negative
          float indicates schedule criticality.
        expression: MIN(fact_task_current_v.total_float)
        type: numeric
        columns:
        - fact_task_current_v.total_float
      sch_percent_complete:
        displayName: Schedule Percent Complete
        description: Weighted average percent complete across all active tasks on
          a project.
        expression: AVERAGE(fact_task_current_v.percent_complete)
        type: numeric
        columns:
        - fact_task_current_v.percent_complete
      sch_spi:
        displayName: Schedule Performance Index (SPI)
        description: Ratio of earned value to planned value. SPI < 1.0 indicates the
          project is behind schedule.
        expression: DIVIDE(SUM(fact_task_current_v.earned_value), SUM(fact_task_current_v.planned_value))
        type: numeric
        columns:
        - fact_task_current_v.earned_value
        - fact_task_current_v.planned_value
      00 actual_cost_to_date_project_billing:
        displayName: 00 actual cost to date project billing
        description: Power BI measure 00 actual_cost_to_date_project_billing on fact_project_billing_current_v.
        expression: 'CALCULATE(SUM(fact_project_cash_position_v[cost_to_date]),

          fact_project_cash_position_v[etl_gold_timestamp] = MAX(fact_project_cash_position_v[etl_gold_timestamp])

          )'
        type: numeric
        columns:
        - cost_to_date
        - etl_gold_timestamp
        x-source: powerbi-semantic-model
        x-expressionLanguage: DAX
        x-powerBiTable: fact_project_billing_current_v
