          \ <> 1,\n        BLANK(),\n        SWITCH(\n            TRUE(),\n      \
          \      CurrentAvg > TrendingAvg, UNICHAR ( 9650 ),\n            CurrentAvg\
          \ = TrendingAvg, \"-\",\n            CurrentAvg < TrendingAvg, UNICHAR (\
