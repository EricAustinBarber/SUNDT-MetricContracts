        type: decimal(28,15)
      - name: cb_mh_gl_to_date
        displayName: CB Manhour G/L To Date
        description: <p>[CB Man Hours Earned] - [Actual Man Hours (To Date)].</p>
        type: decimal(28,15)
      - name: cb_earned_qty
        displayName: CB Earned Quantity
        description: '<p>Current Budget earned quantity to date, calculated as follows:
          [% Complete (of Forecast T/O Qty)] x [CB Total Qty].</p>'
