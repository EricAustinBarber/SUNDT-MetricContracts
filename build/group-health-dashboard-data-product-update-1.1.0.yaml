      Bottom 4 Financial HTML:
        displayName: Bottom 4 Financial HTML
        description: Power BI measure Bottom 4 Financial HTML on Project Grades.
        expression: "VAR Bottom4 =\n    TOPN(\n        4,\n        FILTER(\n     \
          \       ALLSELECTED('Project Grades'[project_number]),\n            CALCULATE([FIN_Score_Measure])\
          \ <> 0\n        ),\n        [FIN_Score_Measure],\n        ASC,\n       \
          \ 'Project Grades'[project_number],\n        ASC\n    )\n\nVAR RankedTable\
          \ =\n    ADDCOLUMNS(\n        Bottom4,\n        \"@Score\", CALCULATE([FIN_Score_Measure]),\n\
          \        \"@Index\",\n            RANKX(\n                Bottom4,\n   \
          \             CALCULATE([FIN_Score_Measure]),\n                ,\n     \
          \           ASC,\n                SKIP\n            )\n    )\n\nRETURN\n\
          \"<div style='border:none;\n             padding:0;\n             margin:0;\n\
          \             width:100%;\n             font-family:Segoe UI;'>\"\n&\nCONCATENATEX(\n\
          \    RankedTable,\n    VAR Score = [@Score]\n\n    VAR Color =\n       \
          \ SWITCH(\n            TRUE(),\n            Score < 0.5, \"#EE8B8E\",\n\
          \            Score < 0.8, \"#F3D03E\",\n            \"#92E9A6\"\n      \
          \  )\n\n    VAR BorderStyle =\n        IF(\n            [@Index] = 4,\n\
          \            \"border-bottom:none;\",\n            \"border-bottom:1px solid\
          \ #E6E6E6;\"\n        )\n\n    RETURN\n        \"<div style='display:flex;\n\
          \                    justify-content:space-between;\n                  \
          \  align-items:center;\n                    width:100%;\n              \
          \      padding:4px 0;\n                    margin:0;\n                 \
          \   \" & BorderStyle & \"\n                    font-family:Segoe UI;\n \
          \                   font-size:16px;\n                    font-weight:700;'>\n\
          \n            <div style='margin-left:18px;\n                        color:#333;'>\"\
          \ &\n                'Project Grades'[project_number] &\n            \"\
          </div>\n\n            <div style='background-color:\" & Color & \";\n  \
          \                      padding:1px 10px;\n                        line-height:16px;\n\
          \                        border-radius:4px;\n                        color:#111;\n\
          \                        text-align:center;\n                        min-width:70px;\n\
          \                        margin-right:18px;'>\" &\n                FORMAT(Score,\
          \ \"0.00%\") &\n            \"</div>\n\n        </div>\",\n    \"\",\n \
          \   [@Score],\n    ASC\n)\n&\n\"</div>\""
        type: numeric
