      Arrow_Date:
        displayName: Arrow Date
        description: Power BI measure Arrow_Date on Project Grades.
        expression: "VAR DateCount =\n    CALCULATE (\n        DISTINCTCOUNT ( 'Trending\
          \ Data'[Month] ),\n        ALL ( 'Trending Data'[Month] )\n    )\n\nVAR\
          \ LatestDate =\n    CALCULATE (\n        MAX ( 'Trending Data'[Month] ),\n\
          \        ALL ( 'Trending Data'[Month] )\n    )\n\nVAR SecondLatestDate =\n\
          \    MAXX (\n        TOPN (\n            1,\n            FILTER (\n    \
          \            ALL ( 'Trending Data'[Month] ),\n                'Trending\
          \ Data'[Month] < LatestDate\n            ),\n            'Trending Data'[Month],\
          \ DESC\n        ),\n        'Trending Data'[Month]\n    )\n\nRETURN\n  \
          \  IF (\n        DateCount = 1,\n        LatestDate,\n        IF (\n   \
          \         LatestDate >= TODAY () - 7,\n            SecondLatestDate,\n \
          \           LatestDate\n        )\n    )"
        type: numeric
        columns:
        - Month
        x-source: powerbi-semantic-model
        x-expressionLanguage: DAX
        x-powerBiTable: Project Grades
        x-powerBiRole: base_value
        x-formatString: General Date
        x-grain: project_or_report_context
        x-aggregationRule: model_defined
        x-transitiveDependencies:
        - Month
