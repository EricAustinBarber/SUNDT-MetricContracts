      00 Average_Days_Outstanding_by_PO:
        displayName: 00 Average Days Outstanding by PO
        description: Power BI measure 00 Average_Days_Outstanding_by_PO on fact_project_billing_current_v.
        expression: "AVERAGEX(\n    'fact_project_billing_current_v',\n    VAR INVDateFilter\
          \ = \n        CALCULATE(\n            MAX('fact_project_billing_current_v'[invoice_date]),\
          \ \n            'fact_project_billing_current_v'[gross_amount] > 0,\n  \
          \          NOT(ISBLANK(fact_project_billing_current_v[paid_date])),\n  \
          \          'fact_project_billing_current_v'[export_date] = MAX('fact_project_billing_current_v'[export_date])\n\
          \        )\n    \n    VAR LatestPaidDate = \n        CALCULATE(\n      \
          \      MAX('fact_project_billing_current_v'[paid_date]),\n            NOT(ISBLANK(fact_project_billing_current_v[paid_date])),\n\
          \            'fact_project_billing_current_v'[gross_amount] > 0\n      \
          \  )\n\n    VAR IsPaid = NOT(ISBLANK(LatestPaidDate))\n\n    VAR DateDiff\
          \ = \n        IF(\n            IsPaid,\n            DATEDIFF(INVDateFilter,\
