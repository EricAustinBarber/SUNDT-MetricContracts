    fact_cor_log_v:
      name: fact_cor_log_v
      displayName: COR LOG Transactions
      description: <div><p>The `fact_cor_log_v` is a view table that contains log
        data related to project management, including details about change orders
        (CORs), projects, clients, pricing, revenue, and other financial information.
        This view likely serves as a central repository for tracking updates and changes
        to project-related data over time.</p><p>Some questions that could be answered
        by joining this table with others:</p><p>- What are the details of a specific
        change order, including its status, pricing, and revenue information? Join
        on prod.project_management_v.dim_cor_v.dim_cor_key = prod.project_management_v.fact_cor_log_v.dim_cor_key</p></div>
      schema:
      - name: etl_gold_timestamp
        displayName: Etl Gold Timestamp
        description: <p>The date and time when this business event occurred.</p>
        type: timestamp
      - name: pricing_status
        displayName: Pricing Status
        description: <p>The Pricing Status <span id="isPasted">indicates where a Change
          Order Request (COR) stands in the pricing lifecycle — specifically whether
          cost impacts have been developed, reviewed, and agreed upon.</span></p>
        type: string
      - name: dim_cco_key
        displayName: Dim Contract Completion Override Key
        description: <p>System-generated key used to uniquely identify this record
          for reporting.</p>
        type: bigint
      - name: is_active
        displayName: Is Active
        description: <div><p><span id="isPasted">Indicates whether the record is currently
          active. Active records are visible in the UI.</span></p></div>
        type: boolean
      - name: custom_field_2
        displayName: Custom Field 2
        description: '<div><div><p id="isPasted"><span style="margin: 0px; color:
          rgb(0, 0, 0);">Refers to user-configurable fields that extend the default
          schema of the InEight Change module. These fields allow the organization
          to add additional attributes or metadata beyond the built-in fields. InEight
          supports custom drop-down lists (custom lists) and custom fields that are
          specific to Issues, CORs, or CCOs. These fields are <strong style="margin:
          0px; font-weight: 700;">free text fields</strong>.</span></p><p><span style="margin:
          0px; font-size: 13px; color: rgb(0, 0, 0);"><br style="margin: 0px;"></span></p><p><span
          style="margin: 0px; font-size: 13px; color: rgb(0, 0, 0);">Purpose / Use
          Case<br style="margin: 0px;"></span></p><ul><li style="margin: 0px;"><span
          style="margin: 0px; font-size: 13px; color: rgb(0, 0, 0);">To capture additional,
          project-specific data that is not supported by the standard InEight Change
          fields (e.g. risk category, region, internal classification).<br style="margin:
          0px;"></span></li><li style="margin: 0px;"><span style="margin: 0px; font-size:
          13px; color: rgb(0, 0, 0);">To allow flexibility in the Change module so
          different projects can track unique attributes relevant to their workflows.<br
          style="margin: 0px;"></span></li><li style="margin: 0px;"><span style="margin:
          0px; font-size: 13px; color: rgb(0, 0, 0);">To integrate extra metadata
          into reporting and analytics (Power BI, dashboards) tied to issues or change
          records.<br style="margin: 0px;"></span></li><li style="margin: 0px;"><span
          style="margin: 0px; font-size: 13px; color: rgb(0, 0, 0);">In a mature usage
          model, custom fields can support filtering, grouping, and trend analysis
          of issues based on nonstandard classification schemes.</span></li></ul></div><p><br></p></div>'
        type: string
      - name: revenue_change_status
        displayName: Revenue Change Status
        description: <div><p>Status of the record's revenue category or revenue change
          for forecasting and reporting purposes.</p></div>
        type: string
      - name: date_price_to_client
        displayName: Date Price To Client
        description: <p>“Date Priced to Client” identifies the date on which pricing
          associated with a change, issue, Change Order Request (COR), or Client Change
          Order (CCO) was formally submitted or communicated to the client. This field
          provides traceability for when the financial impact of a change was presented
          for client review, negotiation, or approval.</p>
        type: timestamp
      - name: dim_cor_key
        displayName: Dim Cor Key
        description: <p>System-assigned identifier used to uniquely represent this
          record.</p>
        type: bigint
      - name: ball_in_court
        displayName: Ball In Court
        description: <div><p>Identifies the responsible party currently driving the
          issue forward (e.g., contractor), supporting accountability in the change
          issue workflow.</p></div>
        type: string
      - name: markup
        displayName: Markup
        description: <div><p>Total markup amount applied to the record during pricing.</p></div>
        type: decimal(28,15)
      - name: modified_date_key
        displayName: Modified Date Key
        description: <p>Last modified timestamp across all fields, used as the incremental-load
          watermark to pull only changed PCO records for reporting extracts.</p>
        type: timestamp
      - name: revenue_category
        displayName: Revenue Category
        description: '<div><div><p id="isPasted"><span style="margin: 0px; color:
          rgb(0, 0, 0);">Identifies the classification of potential or realized revenue
          associated with an issue. In InEight, revenue categories are defined within
          the organization’s master data and are selectable from a drop-down list.
          This field is intended to categorize issues based on how they contribute
          to project revenue recognition or adjustment.</span><span style="margin:
          0px; font-size: 13px; color: rgb(0, 0, 0);"><br style="margin: 0px;"></span><br><span
          style="margin: 0px; font-size: 13px; color: rgb(0, 0, 0);">At Sundt, this
          field is <strong style="margin: 0px; font-weight: 700;"><u style="margin:
          0px;">not currently used as designed by InEight</u></strong>. Instead, it
          serves a limited purpose—to indicate when an issue has been executed as
          a Change Order, supporting alignment between issue management and contract
          execution records.</span></p><p><span style="margin: 0px; font-size: 13px;
          color: rgb(0, 0, 0);"><br style="margin: 0px;"></span></p><p><span style="margin:
          0px; font-size: 13px; color: rgb(0, 0, 0);">Purpose / Use Case</span><span
          style="margin: 0px; font-size: 13px; color: rgb(0, 0, 0);"><br style="margin:
          0px;"></span></p><ul><li style="margin: 0px;"><span style="margin: 0px;
          font-size: 13px; color: rgb(0, 0, 0);">To categorize revenue-related issues
          for tracking and reporting (InEight intended use).</span><span style="margin:
          0px; font-size: 13px; color: rgb(0, 0, 0);"><br style="margin: 0px;"></span></li><li
          style="margin: 0px;"><span style="margin: 0px; font-size: 13px; color: rgb(0,
          0, 0);">To identify issues that have progressed to executed commercial change
          (Sundt current use).</span><span style="margin: 0px; font-size: 13px; color:
          rgb(0, 0, 0);"><br style="margin: 0px;"></span></li><li style="margin: 0px;"><span
          style="margin: 0px; font-size: 13px; color: rgb(0, 0, 0);">To support potential
          future integration with financial reporting or ERP systems for revenue recognition.</span><span
          style="margin: 0px; font-size: 13px; color: rgb(0, 0, 0);"><br style="margin:
          0px;"></span></li><li style="margin: 0px;"><span style="margin: 0px; font-size:
          13px; color: rgb(0, 0, 0);">To maintain consistency and audit visibility
          when an issue transitions into an executed contract change.</span></li></ul></div></div>'
        type: string
      - name: start_date_key
        displayName: Start Date Key
        description: <p>System-generated key used to uniquely identify this record
