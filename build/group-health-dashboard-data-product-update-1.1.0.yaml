        displayName: Net Value
        description: <div><p>Net priced value of the record after deductions are applied.</p></div>
        type: decimal(28,15)
      - name: deduction
        displayName: Deduction
        description: <div><p>Total deduction amount applied to the record during pricing.</p></div>
        type: decimal(28,15)
      - name: current_value
        displayName: Current Value
        description: <div><p>Current priced value of the record before deductions,
          based on the pricing components entered for the change.</p></div>
        type: decimal(28,15)
      - name: custom_field_4
        displayName: Custom Field 4
        description: '<div><div><p id="isPasted"><span style="margin: 0px; color:
          rgb(0, 0, 0);">Refers to user-configurable fields that extend the default
          schema of the InEight Change module. These fields allow the organization
          to add additional attributes or metadata beyond the built-in fields. InEight
          supports custom drop-down lists (custom lists) and custom fields that are
          specific to Issues, CORs, or CCOs.  These fields are <strong style="margin:
          0px; font-weight: 700;">free text fields</strong>.</span></p><p><span style="margin:
          0px; font-size: 13px; color: rgb(0, 0, 0);"><br style="margin: 0px;"></span></p><p><span
          style="margin: 0px; font-size: 13px; color: rgb(0, 0, 0);">Purpose / Use
          Case<br style="margin: 0px;"></span></p><ul><li style="margin: 0px;"><span
          style="margin: 0px; font-size: 13px; color: rgb(0, 0, 0);">To capture additional,
          project-specific data that is not supported by the standard InEight Change
          fields (e.g. risk category, region, internal classification).<br style="margin:
          0px;"></span></li><li style="margin: 0px;"><span style="margin: 0px; font-size:
          13px; color: rgb(0, 0, 0);">To allow flexibility in the Change module so
          different projects can track unique attributes relevant to their workflows.<br
          style="margin: 0px;"></span></li><li style="margin: 0px;"><span style="margin:
          0px; font-size: 13px; color: rgb(0, 0, 0);">To integrate extra metadata
          into reporting and analytics (Power BI, dashboards) tied to issues or change
          records.<br style="margin: 0px;"></span></li><li style="margin: 0px;"><span
          style="margin: 0px; font-size: 13px; color: rgb(0, 0, 0);">In a mature usage
          model, custom fields can support filtering, grouping, and trend analysis
          of issues based on nonstandard classification schemes.</span></li></ul></div><p><br></p></div>'
        type: string
      - name: created_date_key
        displayName: Created Date Key
        description: <p>Date the PCO was created in the system, establishing the start
          of the change management timeline used for aging and reporting.</p>
        type: timestamp
      - name: cost
        displayName: Cost
        description: <div><p>Total priced cost amount associated with the record before
          deductions.</p></div>
        type: decimal(28,15)
      - name: value_type
        displayName: Value Type
        description: <p>The pricing column from the Pricing Summary tab upon which
          the contributed value is based. </p>
        type: string
      - name: probability_percentage
        displayName: Probability Percentage
        description: '<div><div><p id="isPasted"><span style="margin: 0px; color:
          rgb(0, 0, 0);">A numeric value (0%–100%) that indicates the likelihood that
          a given issue or change (e.g. PCO, CCO, or Issue) will be approved or executed.
          In InEight, probability percentages are associated with revenue categories
          defined in the organization’s master data and are used in revenue forecasting
          and change order projections. </span><br><br><span style="margin: 0px; color:
          rgb(0, 0, 0);">At Sundt, this field i<strong style="margin: 0px; font-weight:
          700;"><u style="margin: 0px;">s not currently used as designed by InEight.</u></strong><br
          style="margin: 0px;"></span></p><p><span style="margin: 0px; font-size:
          13px; color: rgb(0, 0, 0);">Purpose / Use Case<br style="margin: 0px;"></span></p><ul><li
          style="margin: 0px;"><span style="margin: 0px; font-size: 13px; color: rgb(0,
          0, 0);">To weight forecasted revenue or cost of changes by the probability
          of execution, thereby refining financial projections. <br style="margin:
          0px;"></span></li><li style="margin: 0px;"><span style="margin: 0px; font-size:
          13px; color: rgb(0, 0, 0);">To support scenario planning, risk analysis,
          and decision-making around changes not yet approved.<br style="margin: 0px;"></span></li><li
          style="margin: 0px;"><span style="margin: 0px; font-size: 13px; color: rgb(0,
          0, 0);">To provide organizational-level control over how revenue assumptions
          are applied in InEight Control.</span></li></ul></div></div>'
        type: decimal(28,15)
      - name: ball_in_court_person
        displayName: Ball In Court Person
        description: <p>“Ball In Court Person” identifies the specific individual
          currently responsible for advancing, reviewing, responding to, or resolving
          an issue within the Change Management workflow. This field establishes accountability
          by indicating who currently has ownership of the issue and is expected to
          take the next action.</p>
