          \ 0)\nVAR Score4 = IF(Value4 = 1, AVERAGE('Project Grades'[FIN_CashflowPosition]),\
          \ 0)\nVAR Score5 = IF(Value5 = 1, AVERAGE('Project Grades'[FIN_ARDays]),\
          \ 0)\nVAR Score6 = IF(Value6 = 1, AVERAGE('Project Grades'[FIN_BillingSpread]),\
          \ 0)\nVAR Score7 = IF(Value7 = 1, AVERAGE('Project Grades'[FIN_QTYvsHR]),\
          \ 0)\nVAR Score8 = IF(Value8 = 1, AVERAGE('Project Grades'[FIN_ChangeRisk]),\
