          data-otype="attribute" href="/app/attribute/78476"></a>.</p>
        type: decimal(28,15)
      - name: cb_unit_per_mh
        displayName: CB Units Per Manhour
        description: <p><a class="fr-deletable" data-oid="78476" data-otype="attribute"
          href="/app/attribute/78476"></a>  divided by <a class="fr-deletable" data-oid="77898"
          data-otype="attribute" href="/app/attribute/77898"></a>  in the current
          budget (inverse of MH per unit).</p>
