          \ =\n    [Arrow_Date]\n    \nVAR CurrentAvg =\n    ROUND(AVERAGE ( 'Project\
          \ Grades'[CostperDef]),2)\n\nVAR TrendingAvg =\n    CALCULATE (\n      \
          \  ROUND(AVERAGE ( 'Trending Data'[CostperDef] ),2),\n        'Trending\
