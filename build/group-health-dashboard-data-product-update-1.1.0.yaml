      Walk_Participation_Pct_measure:
        displayName: Walk Participation Pct measure
        description: Power BI measure Walk_Participation_Pct_measure on Project Grades.
        expression: "CALCULATE(\n    DIVIDE(\n        COUNTROWS(\n            SUMMARIZE(\n\
          \                FILTER(\n                    'STCKY Walks',\n         \
          \           'STCKY Walks'[met_goal] = \"Yes\"\n                ),\n    \
          \            'STCKY Walks'[start_of_month],\n                'STCKY Walks'[full_name]\n\
          \            )\n        ),\n        COUNTROWS(\n            SUMMARIZE(\n\
          \                'STCKY Walks',\n                'STCKY Walks'[start_of_month],\n\
          \                'STCKY Walks'[full_name]\n            )\n        )\n  \
          \  )\n)"
        type: numeric
        columns:
        - full_name
        - met_goal
        - start_of_month
