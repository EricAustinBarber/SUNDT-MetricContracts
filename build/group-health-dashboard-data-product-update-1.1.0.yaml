      Total_Score_Measure:
        displayName: Total Score Measure
        description: Power BI measure Total_Score_Measure on Project Grades.
        expression: "//-------------------------------------------\n// FIN Scoring\
          \ Weights and Toggles\n//-------------------------------------------\nVAR\
          \ Value1 = [COST PERC COMP Value]\nVAR Value2 = [BILLINGS PERC COMP Value]\n\
          VAR Value3 = [MARGIN GAIN/FADE Value]\nVAR Value4 = [CASHFLOW Value]\nVAR\
          \ Value5 = [AGED RECEIVABLES DAYS Value]\nVAR Value6 = [BILLINGS SPREAD\
          \ Value]\nVAR Value7 = [HOURS W/O QTY Value]\nVAR Value8 = [CHANGE RISK\
          \ Value]\nVAR Value9 = [PROCUREMENT PERC COMP Value]\nVAR Value10 = [RECONCILIATION\
          \ Value]\nVAR Value11 = [PROFORMA REVENUE Value]\nVAR Value12 = [PROFORMA\
          \ MARGIN Value]\nVAR Value13 = [UNDER BILLED Value]\nVAR Value14 = [SP PF\
          \ Value]\nVAR FIN_Total_Possible = \n    (Value1 * 5) +\n    (Value2 * 2)\
          \ +\n    (Value3 * 3) +\n    (Value4 * 4) +\n    (Value5 * 4) +\n    (Value6\
          \ * 2) +\n    (Value7 * 2) +\n    (Value8 * 2) +\n    (Value9 * 2) +\n \
          \   (Value10 * 2) +\n    (Value11 * 3) +\n    (Value12 * 5) +\n    (Value13\
          \ * 5) +\n    (Value14 * 2)\n\nVAR FIN_Score = [FIN_Score]\n\n//-------------------------------------------\n\
          // QDR Scoring Weights and Toggles\n//-------------------------------------------\n\
          VAR QDR1 = [COST PER REV Value]\nVAR QDR2 = [COST PER DEF Value]\nVAR QDR3\
          \ = [ITP Value]\nVAR QDR4 = [SUNDT COST PER MHR Value]\n\nVAR QDR_Total_Possible\
          \ =\n    (QDR1 * 2.5) +\n    (QDR2 * 2.5) +\n    (QDR3 * 2.5) +\n    (QDR4\
          \ * 2.5)\n\nVAR QDR_Score = [QDR_Score]\n\n//-------------------------------------------\n\
          // Safety Scoring Weights and Toggles\n//-------------------------------------------\n\
          VAR SAF1 = [STCKY WALKS Value]\nVAR SAF2 = [STCKY SUCCESS RATE Value]\n\
          VAR SAF3 = [ENERGY INDEX Value]\nVAR SAF4 = [PSLI SCORE Value]\nVAR SAF5\
          \ = [CVIS IMPLEMENTATION Value]\n\nVAR SAF_Total_Possible =\n    (SAF1 *\
          \ 5) +\n    (SAF2 * 5) +\n    (SAF3 * 4) +\n    (SAF4 * 4) +\n    (SAF5\
          \ * 2)\n\nVAR SAF_Score = [Safety_Score]\n\n//-------------------------------------------\n\
          // Schedule Scoring Weights and Toggles\n//-------------------------------------------\n\
          VAR SCH1 = [SCH PERCENT COMPLETE Value]\nVAR SCH2 = [SUBSTANTIAL COMPLETION\
          \ Value]\nVAR SCH3 = [FLOAT TREND Value]\nVAR SCH4 = [PLANNED VS ACTUALS\
          \ START Value]\nVAR SCH5 = [SPI Value]\nVAR SCH6 = [BASELINE VS PLANNED\
          \ EAC Value]\nVAR SCH7 = [PLANNED VS ACTUALS END Value]\n\nVAR SCH_Total_Possible\
          \ =\n    (SCH1 * 5) +\n    (SCH2 * 4) +\n    (SCH3 * 4) +\n    (SCH4 * 4)\
          \ +\n    (SCH5 * 5) +\n    (SCH6 * 2) +\n    (SCH7 * 4)\n\nVAR SCH_Score\
          \ = [SCH_Score]\n\n//-------------------------------------------\n// Total\
          \ Score Calculation\n//-------------------------------------------\nVAR\
          \ FIN_Weighted =\n    IF(FIN_Total_Possible = 0, .4, DIVIDE(FIN_Score, FIN_Total_Possible,\
          \ 0) * 0.40)\n\nVAR QDR_Weighted =\n    IF(QDR_Total_Possible = 0, .1, DIVIDE(QDR_Score,\
          \ QDR_Total_Possible, 0) * 0.10)\n\nVAR SAF_Weighted =\n    IF(SAF_Total_Possible\
          \ = 0, .2, DIVIDE(SAF_Score, SAF_Total_Possible, 0) * 0.20)\n\nVAR SCH_Weighted\
          \ =\n    IF(SCH_Total_Possible = 0, .3, DIVIDE(SCH_Score, SCH_Total_Possible,\
          \ 0) * 0.30)\n\nRETURN\nFIN_Weighted +\nQDR_Weighted +\nSAF_Weighted +\n\
          SCH_Weighted"
        type: numeric
        columns:
        - AGED RECEIVABLES DAYS Value
        - BASELINE VS PLANNED EAC Value
        - BILLINGS PERC COMP Value
        - BILLINGS SPREAD Value
        - CASHFLOW Value
