      Total_Score:
        displayName: Total Score
        description: Power BI measure Total_Score on Project Grades.
        expression: "// ===== FIN Section =====\nVAR Value1 = [COST PERC COMP Value]\n\
          VAR Value2 = [BILLINGS PERC COMP Value]\nVAR Value3 = [MARGIN GAIN/FADE\
          \ Value]\nVAR Value4 = [CASHFLOW Value]\nVAR Value5 = [AGED RECEIVABLES\
          \ DAYS Value]\nVAR Value6 = [BILLINGS SPREAD Value]\nVAR Value7 = [HOURS\
          \ W/O QTY Value]\nVAR Value8 = [CHANGE RISK Value]\nVAR Value9 = [PROCUREMENT\
          \ PERC COMP Value]\nVAR Value10 = [RECONCILIATION Value]\nVAR Value11 =\
          \ [PROFORMA REVENUE Value]\nVAR Value12 = [PROFORMA MARGIN Value]\nVAR Value13\
          \ = [UNDER BILLED Value]\nVAR Value14 = [SP PF Value]\n\nVAR Score_FIN =\n\
          \    IF(Value1 = 1, AVERAGE('Project Grades'[FIN_CostPercComp]), 0) +\n\
          \    IF(Value2 = 1, AVERAGE('Project Grades'[FIN_BillingPercComp]), 0) +\n\
          \    IF(Value3 = 1, AVERAGE('Project Grades'[FIN_MarginGainLoss]), 0) +\n\
          \    IF(Value4 = 1, AVERAGE('Project Grades'[FIN_CashflowPosition]), 0)\
          \ +\n    IF(Value5 = 1, AVERAGE('Project Grades'[FIN_ARDays]), 0) +\n  \
          \  IF(Value6 = 1, AVERAGE('Project Grades'[FIN_BillingSpread]), 0) +\n \
          \   IF(Value7 = 1, AVERAGE('Project Grades'[FIN_QTYvsHR]), 0) +\n    IF(Value8\
          \ = 1, AVERAGE('Project Grades'[FIN_ChangeRisk]), 0) +\n    IF(Value9 =\
          \ 1, AVERAGE('Project Grades'[FIN_Procurement]), 0) +\n    IF(Value10 =\
          \ 1, AVERAGE('Project Grades'[FIN_Recon]), 0) +\n    IF(Value11 = 1, AVERAGE('Project\
          \ Grades'[FIN_ProRev]), 0) +\n    IF(Value12 = 1, AVERAGE('Project Grades'[FIN_ProMar]),\
          \ 0) +\n    IF(Value13 = 1, AVERAGE('Project Grades'[FIN_UnderBilledPosition]),\
          \ 0) +\n    IF(Value14 = 1, AVERAGE('Project Grades'[FIN_SelfPerformPF]),\
          \ 0)\n\n// ===== QDR Section =====\nVAR Include1 = [COST PER REV Value]\n\
          VAR Include2 = [COST PER DEF Value]\nVAR Include3 = [ITP Value]\nVAR Include4\
          \ = [SUNDT COST PER MHR Value]\n\nVAR Score_QDR =\n    IF(Include1 = 1,\
          \ AVERAGE('Project Grades'[QDR_Cost_per_Rev]), 0) +\n    IF(Include2 = 1,\
          \ AVERAGE('Project Grades'[QDR_CostperDef]), 0) +\n    IF(Include3 = 1,\
          \ AVERAGE('Project Grades'[QDR_ITPs]), 0) +\n    IF(Include4 = 1, AVERAGE('Project\
          \ Grades'[QDR_SundtCostperMHR]), 0)\n\n// ===== Safety Section =====\nVAR\
          \ Include_CVIS = [CVIS IMPLEMENTATION Value]\nVAR Include_Energy = [ENERGY\
          \ INDEX Value]\nVAR Include_PSLI = [PSLI SCORE Value]\nVAR Include_STCKY_Success\
          \ = [STCKY SUCCESS RATE Value]\nVAR Include_STCKY_Walks = [STCKY WALKS Value]\n\
          \nVAR Score_Safety =\n    IF(Include_CVIS = 1, AVERAGE('Project Grades'[Safety_CVIS_WALKS]),\
          \ 0) +\n    IF(Include_Energy = 1, AVERAGE('Project Grades'[Safety_Energy]),\
          \ 0) +\n    IF(Include_PSLI = 1, AVERAGE('Project Grades'[Safety_PSLI]),\
          \ 0) +\n    IF(Include_STCKY_Success = 1, AVERAGE('Project Grades'[Safety_STCKY_Success_Rate]),\
          \ 0) +\n    IF(Include_STCKY_Walks = 1, AVERAGE('Project Grades'[Safety_STCKY_WALKS]),\
          \ 0)\n\n// ===== Schedule Section =====\nVAR SCH1 = [SCH PERCENT COMPLETE\
          \ Value]\nVAR SCH2 = [SUBSTANTIAL COMPLETION Value]\nVAR SCH3 = [FLOAT TREND\
          \ Value]\nVAR SCH4 = [PLANNED VS ACTUALS START Value]\nVAR SCH5 = [SPI Value]\n\
          VAR SCH6 = [BASELINE VS PLANNED EAC Value]\nVAR SCH7 = [PLANNED VS ACTUALS\
          \ END Value]\n\nVAR Score_SCH =\n    IF(SCH1 = 1, AVERAGE('Project Grades'[SCH_PercComp]),\
          \ 0) +\n    IF(SCH2 = 1, AVERAGE('Project Grades'[SCH_SCOMP_Total_Float]),\
          \ 0) +\n    IF(SCH3 = 1, AVERAGE('Project Grades'[SCH_MIN_Float_Trend]),\
          \ 0) +\n    IF(SCH4 = 1, AVERAGE('Project Grades'[SCH_PvsAStart]), 0) +\n\
          \    IF(SCH5 = 1, AVERAGE('Project Grades'[SCH_SPI]), 0) +\n    IF(SCH6\
