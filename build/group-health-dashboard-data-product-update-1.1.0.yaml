      FIN_Score_Trending:
        displayName: FIN Score Trending
        description: Power BI measure FIN_Score_Trending on Trending Data.
        expression: "VAR SelectedArrowDate = [Arrow_Date]\n\nVAR Value1 = [COST PERC\
          \ COMP Value]\nVAR Value2 = [BILLINGS PERC COMP Value]\nVAR Value3 = [MARGIN\
          \ GAIN/FADE Value]\nVAR Value4 = [CASHFLOW Value]\nVAR Value5 = [AGED RECEIVABLES\
          \ DAYS Value]\nVAR Value6 = [BILLINGS SPREAD Value]\nVAR Value7 = [HOURS\
          \ W/O QTY Value]\nVAR Value8 = [CHANGE RISK Value]\nVAR Value9 = [PROCUREMENT\
          \ PERC COMP Value]\nVAR Value10 = [RECONCILIATION Value]\nVAR Value11 =\
          \ [PROFORMA REVENUE Value]\nVAR Value12 = [PROFORMA MARGIN Value]\nVAR Value13\
          \ = [UNDER BILLED Value]\nVAR Value14 = [SP PF Value]\n\nVAR Score1 =\n\
          \    IF (\n        Value1 = 1,\n        CALCULATE (\n            AVERAGE\
          \ ( 'Trending Data'[FIN_CostPercComp] ),\n            FILTER ( ALL ( 'Trending\
          \ Data'[Month] ), 'Trending Data'[Month] = SelectedArrowDate )\n       \
          \ ),\n        0\n    )\n\nVAR Score2 =\n    IF (\n        Value2 = 1,\n\
          \        CALCULATE (\n            AVERAGE ( 'Trending Data'[FIN_BillingPercComp]\
          \ ),\n            FILTER ( ALL ( 'Trending Data'[Month] ), 'Trending Data'[Month]\
          \ = SelectedArrowDate )\n        ),\n        0\n    )\n\nVAR Score3 =\n\
          \    IF (\n        Value3 = 1,\n        CALCULATE (\n            AVERAGE\
          \ ( 'Trending Data'[FIN_MarginGainLoss] ),\n            FILTER ( ALL ( 'Trending\
          \ Data'[Month] ), 'Trending Data'[Month] = SelectedArrowDate )\n       \
          \ ),\n        0\n    )\n\nVAR Score4 =\n    IF (\n        Value4 = 1,\n\
          \        CALCULATE (\n            AVERAGE ( 'Trending Data'[FIN_CashflowPosition]\
          \ ),\n            FILTER ( ALL ( 'Trending Data'[Month] ), 'Trending Data'[Month]\
          \ = SelectedArrowDate )\n        ),\n        0\n    )\n\nVAR Score5 =\n\
          \    IF (\n        Value5 = 1,\n        CALCULATE (\n            AVERAGE\
          \ ( 'Trending Data'[FIN_ARDays] ),\n            FILTER ( ALL ( 'Trending\
          \ Data'[Month] ), 'Trending Data'[Month] = SelectedArrowDate )\n       \
          \ ),\n        0\n    )\n\nVAR Score6 =\n    IF (\n        Value6 = 1,\n\
          \        CALCULATE (\n            AVERAGE ( 'Trending Data'[FIN_BillingSpread]\
          \ ),\n            FILTER ( ALL ( 'Trending Data'[Month] ), 'Trending Data'[Month]\
          \ = SelectedArrowDate )\n        ),\n        0\n    )\n\nVAR Score7 =\n\
          \    IF (\n        Value7 = 1,\n        CALCULATE (\n            AVERAGE\
          \ ( 'Trending Data'[FIN_QTYvsHR] ),\n            FILTER ( ALL ( 'Trending\
          \ Data'[Month] ), 'Trending Data'[Month] = SelectedArrowDate )\n       \
          \ ),\n        0\n    )\n\nVAR Score8 =\n    IF (\n        Value8 = 1,\n\
          \        CALCULATE (\n            AVERAGE ( 'Trending Data'[FIN_ChangeRisk]\
          \ ),\n            FILTER ( ALL ( 'Trending Data'[Month] ), 'Trending Data'[Month]\
          \ = SelectedArrowDate )\n        ),\n        0\n    )\n\nVAR Score9 =\n\
          \    IF (\n        Value9 = 1,\n        CALCULATE (\n            AVERAGE\
          \ ( 'Trending Data'[FIN_Procurement] ),\n            FILTER ( ALL ( 'Trending\
          \ Data'[Month] ), 'Trending Data'[Month] = SelectedArrowDate )\n       \
          \ ),\n        0\n    )\n\nVAR Score10 =\n    IF (\n        Value10 = 1,\n\
          \        CALCULATE (\n            AVERAGE ( 'Trending Data'[FIN_Recon] ),\n\
          \            FILTER ( ALL ( 'Trending Data'[Month] ), 'Trending Data'[Month]\
          \ = SelectedArrowDate )\n        ),\n        0\n    )\n\nVAR Score11 =\n\
          \    IF (\n        Value11 = 1,\n        CALCULATE (\n            AVERAGE\
          \ ( 'Trending Data'[FIN_ProRev] ),\n            FILTER ( ALL ( 'Trending\
          \ Data'[Month] ), 'Trending Data'[Month] = SelectedArrowDate )\n       \
          \ ),\n        0\n    )\n\nVAR Score12 =\n    IF (\n        Value12 = 1,\n\
          \        CALCULATE (\n            AVERAGE ( 'Trending Data'[FIN_ProMar]\
          \ ),\n            FILTER ( ALL ( 'Trending Data'[Month] ), 'Trending Data'[Month]\
          \ = SelectedArrowDate )\n        ),\n        0\n    )\n\nVAR Score13 =\n\
          \    IF (\n        Value13 = 1,\n        CALCULATE (\n            AVERAGE\
          \ ( 'Trending Data'[FIN_UnderBilledPosition] ),\n            FILTER ( ALL\
          \ ( 'Trending Data'[Month] ), 'Trending Data'[Month] = SelectedArrowDate\
          \ )\n        ),\n        0\n    )\n\nVAR Score14 =\n    IF (\n        Value14\
          \ = 1,\n        CALCULATE (\n            AVERAGE ( 'Trending Data'[FIN_SelfPerformPF]\
          \ ),\n            FILTER ( ALL ( 'Trending Data'[Month] ), 'Trending Data'[Month]\
          \ = SelectedArrowDate )\n        ),\n        0\n    )\n\nRETURN\n    Score1\
          \ + Score2 + Score3 + Score4 + Score5 + Score6 + Score7 +\n    Score8 +\
          \ Score9 + Score10 + Score11 + Score12 + Score13 + Score14"
