        type: decimal(28,15)
      - name: labor_efficiency_to_date
        displayName: Labor Efficiency To Date
        description: <div><p>The Labor Efficiency Index combines labor productivity
          and labor cost indicators into a single, comprehensive score, where a score
          of 1.0 or greater is generally considered favorable, and where a score of
          less than 1.0 needs improvement. The formula is <strong>[CB Productivity
          Factor]</strong> x <strong>[Compensation Factor (To Date)].</strong><br><br><strong>[CB
          Productivity Factor] = </strong>[CB Man Hours Earned] / [Actual Man Hours
          (To Date)]</p><p><strong>[Compensation Factor (To Date)] = </strong>[CB
          Total Labor Cost per Man Hour] / [Actual Labor Cost per Man Hour (To Date)]</p></div>
        type: decimal(28,15)
      - name: ob_total_mh
        displayName: OB Total Manhours
        description: <p>Original Budget manhours in a cost item.</p>
        type: decimal(28,15)
      - name: cb_labor_unit_cost
