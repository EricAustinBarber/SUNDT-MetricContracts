        description: <p>The<span id="isPasted" style=""> </span>sum<span style=""> </span>total
          of Adjusted Billing Amount<span style=""> for </span>cost<span style=""> </span>items with
          the Cost Pricing Category <strong style="">Deductions.</strong></p>
        type: decimal(28,15)
