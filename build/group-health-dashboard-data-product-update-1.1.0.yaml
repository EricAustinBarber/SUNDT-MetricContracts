    dim_cost_item_v:
      name: dim_cost_item_v
      displayName: Cost Item Reference
      description: <div><p>The `dim_cost_item_v` is a view table that contains cost
        item details related to projects. It stores information such as cost item
        IDs, project IDs, account codes, work breakdown structure (WBS) phase codes,
        user-defined fields, and various tags and identifiers used for cost tracking
        and analysis.</p><p>Some questions that could be answered by joining this
        table with others:</p><p>- What are the control budget details for a specific
        cost item? Join on prod.project_management_v.fact_control_budget_v.dim_cost_item_key
        = prod.project_management_v.dim_cost_item_v.dim_cost_item_key</p><p>- What
        are the project details for a specific cost item based on the project number?
        Join on prod.project_management_v.dim_cost_item_v.sec_project = prod.conformed_v.dim_project_v.project_number</p><p>-
        What are the control budget details for a specific cost item? Join on prod.project_management_v.dim_cost_item_v.dim_cost_item_key
        = prod.project_management_v.fact_control_budget_v.dim_cost_item_key</p><p>-
        What are the project details for a specific cost item based on the project
        ID? Join on prod.project_management_v.dim_cost_item_v.project_id = prod.conformed_v.dim_project_v.dim_project_key</p><p>-
        What are the assigned roles and employees for a specific project associated
        with a cost item? Join on prod.project_management_v.dim_cost_item_v.sec_project
        = prod.prolog_v.fact_projects_with_assigned_roles_v.project_number</p></div>
      schema:
      - name: wbs_phase_code
        displayName: Work Breakdown Structure Phase Code
        description: '<div><p id="isPasted"><strong>Definition:</strong><br>The alpha-numeric
          code representing the Work Breakdown Structure (WBS) phase or activity assigned
