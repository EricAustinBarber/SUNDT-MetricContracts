    dim_cco_v:
      name: dim_cco_v
      displayName: CCO Reference
      description: <div><p>This is a view table that contains details of change control
        orders (CCOs) for project management.</p><p>There don't appear to be any known
        joins with this table in the catalog. Here are some questions you might be
        able to answer with this table alone:</p><p>- What are the different statuses
        of CCOs (cco_status, pricing_status, proposal_status)?</p><p>- What are the
        requested and approved extension days for contracts and forecasts?</p><p>-
        How many CCOs are there for each value type?</p></div>
      schema:
      - name: cco_name
        displayName: Contract Completion Override Name
        description: <p>Name or title used to describe a Client Change Order.</p>
        type: string
      - name: dim_cco_key
        displayName: Dim Contract Completion Override Key
        description: <p>Unique identifier for the Contract Change Order (CCO) record
          used to track a potential or executed contract adjustment on a project.</p>
        type: bigint
      - name: cco_status
        displayName: Contract Completion Override Status
        description: <p>Current execution status of the Client Change Order (CCO).</p>
        type: string
      - name: cco_description
        displayName: Contract Completion Override Description
        description: <div><p>Text description for a Client Change Order, including
          scope of work and justification.</p><p><br></p></div>
        type: string
      - name: alternate_cco_id
        displayName: Alternate Contract Completion Override ID
        description: <p>User-defined alternate Client Change Order (CCO) ID, typically
          used to track a client's CCO ID if tracked outside of InEight Change.</p>
        type: bigint
      - name: cco_id
        displayName: Contract Completion Override Id
        description: <p>System-generated unique identifier for a Client Change Order.</p>
        type: bigint
      - name: approved_extension_days_contract
        displayName: Approved Extension Days Contract
        description: <p>Number of days the client has agreed to extend or reduce the
          contract completion date.</p>
        type: int
      - name: approved_extension_days_forecast
        displayName: Approved Extension Days Forecast
        description: <p>The projected number of days Sundt expected a change to impact
          the schedule vs. the number of days approved by the client.</p>
        type: int
      - name: pricing_status
        displayName: Pricing Status
        description: <p><span id="isPasted">Indicates where a Client Change Order
          (CCO) stands in the pricing lifecycle — specifically whether cost impacts
          have been developed, reviewed, and agreed upon.</span></p>
        type: string
      - name: proposal_status
        displayName: Proposal Status
        description: <p><span id="isPasted">Indicates where the CCO stands in the
          <em>external proposal/approval lifecycle</em> — essentially whether the
          change has been formally proposed and what the client has done with it.</span></p>
        type: string
      - name: requested_extension_days_forecast
        displayName: Requested Extension Days Forecast
        description: <p><span id="isPasted">The projected number of days Sundt expects
          a change to impact the schedule vs. the requested number of contract extension
          days.</span></p>
        type: int
      - name: requested_extension_days_contract
        displayName: Requested Extension Days Contract
        description: <p><span id="isPasted">Number of days Sundt has requested to
          extend or reduce the contract completion date at the <a class="fr-deletable"
          data-oid="52" data-otype="glossary_term" href="/app/document/52"></a>  stage.</span></p>
        type: int
      - name: value_type
        displayName: Value Type
        description: <p><span id="isPasted">The pricing column from the Pricing Summary
          tab upon which the contributed value is based.</span></p>
        type: string
      - name: etl_gold_timestamp
