name: Validate Power BI contracts

on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'build/**'
      - 'config/**'
      - 'schemas/**'
      - 'tools/**'
      - '.github/workflows/validate-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'build/**'
      - 'config/**'
      - 'schemas/**'
      - 'tools/**'
      - '.github/workflows/validate-contracts.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate contracts
        run: python tools/validate_all_contracts.py
      - name: Validate Data Product payload
        run: >-
          python tools/validate_data_product_payload.py
          --contract contracts/group-health-dashboard/0.1.0.json
          --payload build/group-health-data-product-0.1.0.json
      - name: Test agent read layer
        working-directory: tools
        run: python -m unittest test_contract_read_layer.py
